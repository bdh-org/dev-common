name: Version guard
description: >
  The VERSION gate, both halves. Fails a pull request whose Makefile VERSION is
  not strictly greater than its base branch's, naming a version the base has
  already taken a COLLISION rather than a missing bump; then fails one whose
  version is already claimed by an EARLIER OPEN pull request, which no branch can
  see from its own contents. One implementation, called as a STEP by ci.yml,
  self-hosted-ci.yml and version-guard.yml
  (bdh-org/dev-common#124, #180, #182, #208, #232, #235, #338).

# A COMPOSITE ACTION, AND CALLED AS A STEP -- both halves of that are the point.
#
# WHY ONE IMPLEMENTATION. The step body lived inline in three workflows, held
# together by a comment and then by a byte-identity test. The comment failed
# twice: #182 tightened ci.yml's comparison to strictly-greater and left
# self-hosted-ci.yml on the weaker test for ten days, while every repo in the
# stack ran the weaker one; #208's VERSION COLLISION branch landed in
# self-hosted-ci.yml alone, so ci.yml told authors to run the `make bump-patch`
# they had just run (#232). Both times the suite stayed green, because it
# compared exit codes and the divergence was in a MESSAGE. A test can catch two
# files disagreeing; only one file cannot disagree with itself.
#
# WHY A STEP RATHER THAN A SIBLING JOB, which is what bdh-org/dev-common#235
# originally proposed. Nine repos (canary, devtemplate, ferret, freddyb, heller,
# hog, oleo, panoptikon, slingshot) require the status check `ci / ci` -- the job
# this step runs inside. A sibling job reports under a NEW context that none of
# them requires, so the guard would quietly stop gating merges while still
# looking green, and fixing that needs a branch-protection write in nine repos
# that no session credential holds. Called as a step, nothing about any
# consumer's protection changes.
#   REVERSAL TRIGGER: if this guard ever needs its own runner or its own
#   permissions, go back to a sibling job -- and add the new context to each
#   repo's required checks FIRST.
#
# WHY A COMPOSITE ACTION RATHER THAN `run: bash common/...`. A reusable
# workflow's steps execute against the CALLER's checkout, and `common` is
# whatever revision the caller pins -- so a script path would resolve into the
# consumer repo and lag behind main. The runner fetches a composite action from
# THIS repo by ref, independently of any checkout, which is the same reason
# claude-install-lock is one (bdh-org/home-infra#541, #881).
#
# WHY THE CALL SITE SAYS `bdh-org/dev-common/...@main` AND NOT `./`. Inside a
# reusable workflow, a relative `uses:` resolves against the CALLING repo's
# checkout, where this action does not exist. The fully qualified form is not
# redundancy; it is the only form that works from a `workflow_call`.
#
# TWO STEPS, because there are two ways to take a number that is not yours.
# version-bumped.sh compares this branch against its BASE, which sees a collision
# only after the other PR has MERGED. version-claimed.sh compares against the
# repo's currently OPEN PRs, which is the case no single branch can see from its
# own contents. Its body was inline in the same three workflows, held by a
# byte-identity case of its own, until bdh-org/dev-common#338 brought it here --
# the same duplication, one step lower down, left behind because #235's brief
# scoped to one step.
#
# ONE CALL SITE PER WORKFLOW, not two. The two gates were adjacent steps; they are
# now the two steps of one action, so each workflow `uses:` it once. A selector
# input to run only one half would be configurability nothing has asked for, and
# the composite steps are NAMED, so the log still attributes a failure to the
# right gate.
#
# HOW THE TOKEN ARRIVES: `${{ github.token }}` in the step's `env:`, decided here
# rather than taken as an input (bdh-org/dev-common#338).
#   - It CANNOT be `secrets.GITHUB_TOKEN`: the `secrets` context is not available
#     inside an action file at all. `github.token` is the documented equivalent
#     and is the run's own token, scoped by the calling job's `permissions`.
#   - NOT an input, because an input must be passed. A caller that omitted it
#     would get "could not list open PRs" on every PR forever -- a check that
#     reports its own absence, which is noise, and noise gets filtered. Nothing
#     can forget an ambient token.
#   - Via `env:`, never interpolated into the command line: a token in argv is
#     visible in process listings and in the log's own command echo.
#   REVERSAL TRIGGER: if a caller ever needs a DIFFERENT token -- to list PRs in
#   another repo, or with a scope `github.token` cannot hold -- add an OPTIONAL
#   `github-token` input defaulting to `${{ github.token }}`. Do not make it
#   required; that is the forgettable-input failure above.
#
# THE PERMISSION SCOPE STAYS WITH THE CALLER. `pull-requests: read` cannot be
# declared from here -- an action has no `permissions:` block -- so it remains in
# each workflow that restricts permissions, and tests/version-claimed.test.sh
# still owns that case. version-claimed.sh degrades to a warning without it.

runs:
  using: composite
  steps:
    # `fetch-depth: 0` is the CALLER's responsibility and cannot be fixed from
    # here: a composite action runs after the checkout it is given. `git diff
    # base...HEAD` and `git merge-base` both need real history, and on a shallow
    # clone there is no merge base -- so the guard would ERROR rather than judge,
    # which is worse than no guard because it still shows a red X that looks like
    # coverage. All three callers check out with `fetch-depth: 0`.
    - name: Version bumped
      shell: bash
      env:
        # Via env, not interpolated into the script. `github.base_ref` is the
        # run's context even inside a composite action, so this is the caller's
        # PR base; it is empty on anything that is not a pull request. Passing it
        # in rather than templating it into the body is also what lets
        # tests/version-bumped.test.sh run this exact file.
        BASE_REF: ${{ github.base_ref }}
      run: bash "${{ github.action_path }}/version-bumped.sh"

    # SECOND, and only if the gate above passed. A composite action stops at its
    # first failing step, which is the order that was already in effect while
    # these were two adjacent workflow steps: a branch whose version is wrong
    # against its own base has nothing to learn yet about other PRs' versions.
    - name: Version claimed by another open PR
      shell: bash
      env:
        # See action.yml's header for why the token is `github.token` via env
        # rather than an input, and what would reverse that.
        GITHUB_TOKEN: ${{ github.token }}
        # `github.event.pull_request.number` is the run's context inside a
        # composite action too, so this is the caller's PR. Empty on anything that
        # is not a pull request, which the script reports as a skip rather than
        # querying the API for PR "".
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.base_ref }}
      run: bash "${{ github.action_path }}/version-claimed.sh"
