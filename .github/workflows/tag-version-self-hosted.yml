name: Tag Version (self-hosted)

# Reusable version-tagging workflow on the forge self-hosted runner.
# Consumers add a thin wrapper:
#
#   on:
#     workflow_dispatch:
#     push:
#       branches: [main]
#   permissions:
#     contents: write
#   jobs:
#     tag:
#       uses: bdh-org/dev-common/.github/workflows/tag-version-self-hosted.yml@main
#
# The tag still lands on github.com: the runner clones from and pushes to
# github.com (authed by the injected GITHUB_TOKEN); only the executing machine
# changes from a cloud runner to forge.
on:
  workflow_call:

permissions:
  contents: write

jobs:
  tag:
    runs-on: [self-hosted, forge]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # need the full tag list to detect existing tags
          clean: true

      - name: Get version from Makefile
        id: version
        run: |
          VERSION=$(grep '^VERSION=' Makefile | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag that already exists is TWO different situations needing OPPOSITE
      # responses, and this step used to conflate them into one silent skip:
      #
      #   same commit      -- a re-run, or a push that changed nothing. Benign.
      #                       Skip, and say why.
      #   DIFFERENT commit -- this tree is on main under a version that belongs
      #                       to another tree. Ten commits across slingshot and
      #                       panoptikon are permanently in that state
      #                       (bdh-org/home-infra#617), and three more landed
      #                       after the guards were believed to close it.
      #                       Nothing anywhere went red. Fail loudly.
      #
      # NOTE this step only helps if the workflow RUNS on the offending commit.
      # Until bdh-org/home-infra#625 it did not: consumers triggered on
      # `paths: ['Makefile']`, and a colliding merge leaves Makefile byte-identical
      # because the base already reached that version, so the filter never
      # matched. The filter is gone from every consumer wrapper (and from this
      # repo's own trigger), so every push to main now reaches this check; a
      # re-run on an already-tagged commit takes the benign branch above.
      #
      # `git rev-list -n1` rather than `git rev-parse`: it resolves an annotated
      # tag to its commit, so the comparison is commit-to-commit either way.
      # `refs/tags/` rather than a bare name: a branch sharing the name would
      # otherwise satisfy the lookup.
      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tagged="$(git rev-list -n1 "refs/tags/${VERSION}")"
          head="$(git rev-parse HEAD)"
          if [ "$tagged" = "$head" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag ${VERSION} already points at this commit -- nothing to do"
            exit 0
          fi
          echo "::error::VERSION COLLISION: ${VERSION} is already tagged, on a DIFFERENT commit."
          echo "::error::  tag ${VERSION} -> ${tagged}"
          echo "::error::  this commit   -> ${head}"
          echo "::error::This tree is on the default branch under a version belonging to"
          echo "::error::another tree, and nothing downstream can tell the two apart."
          echo "::error::"
          echo "::error::Fix forward -- bump to a free number and push:"
          echo "::error::    make bump-patch && git push"
          echo "::error::"
          echo "::error::Do NOT move the existing tag: it describes an image that already"
          echo "::error::shipped. See bdh-org/home-infra#617 for why re-tagging is refused."
          exit 1

      # The push can be rejected for a reason that has nothing to do with the
      # tag: GitHub evaluates a NEW ref's workflow files against the current
      # default branch, so a commit touching .github/workflows/ that landed on
      # main next to the bump makes tag creation trip the workflows-permission
      # check. GITHUB_TOKEN can never hold `workflows`, so no `permissions:`
      # block and no re-run gets past it -- the only fix is a manual tag push
      # with an App token. Left bare, the run dies on an opaque git error and the tag
      # silently goes missing (bdh-org/dev-common#122; hit on finzeug/heller
      # 2026-07-22), so name the cause and the remediation.
      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          sha=$(git rev-parse HEAD)
          # GitHub sometimes answers a push with a 5xx or drops the connection;
          # two tags went missing for five days that way, because nothing re-runs
          # this job (bdh-org/dev-common#375). Retry ONLY those, 3 times with
          # backoff: any other rejection is not transient and fails at once.
          for delay in 5 15 45 last; do
            set +e
            git push origin "$VERSION" >push.log 2>&1
            status=$?
            set -e
            cat push.log
            [ "$status" = 0 ] && exit 0
            grep -qiE 'Internal Server Error|(^|[^0-9])50[23]([^0-9]|$)|connection reset' push.log || break
            [ "$delay" = last ] && break
            echo "::warning::Tag push hit a transient GitHub error; retrying in ${delay}s"
            sleep "$delay"
          done
          if grep -q 'without .workflows. permission' push.log; then
            echo "::error::Tag $VERSION was NOT created. The push was rejected by the"
            echo "::error::workflow-file rule, not by anything wrong with the tag: a commit"
            echo "::error::touching .github/workflows/ landed on main next to this version"
            echo "::error::bump, and GitHub checks a new ref's workflow files against the"
            echo "::error::default branch. GITHUB_TOKEN can never hold 'workflows' permission,"
            echo "::error::so re-running this job cannot help (bdh-org/dev-common#122)."
            echo "::error::Create the tag by hand at the merge commit with an App token:"
            echo "::error::  GH_TOKEN=\"\$(gh-app-token $GITHUB_REPOSITORY_OWNER)\" gh api -X POST repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/tags/$VERSION -f sha=$sha"
            {
              echo "### Tag \`$VERSION\` was not created"
              echo
              echo "Push rejected by GitHub's workflow-file rule — a workflow change"
              echo "landed on main next to the bump (bdh-org/dev-common#122)."
              echo "Re-running will not help. Create the tag by hand at the merge commit"
              echo "with an App token (the bdh-ai PATs were revoked, home-infra#1089):"
              echo
              echo '```'
              echo "GH_TOKEN=\"\$(gh-app-token $GITHUB_REPOSITORY_OWNER)\" gh api -X POST repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/tags/$VERSION -f sha=$sha"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Tag $VERSION was NOT created -- git push failed (see log above)."
          fi
          exit "$status"

  # After main moves, re-bump the next open PR that main left at or below its
  # VERSION (ready PRs first), to main's version plus the PR's own level
  # (bdh-org/dev-common#344, #351, #353).
  # Its own job, on forge, because only forge can mint the App token; the checkout
  # is made WITH that token so the push triggers the PR's CI, which a push with
  # GITHUB_TOKEN never does. continue-on-error: a re-bump must never turn the tag
  # run red. Superseded runs cancel: only the newest main matters.
  # Rollback: `mode: report` below.
  rebump:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, forge]
    continue-on-error: true
    concurrency:
      group: rebump-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Mint the coder App token
        id: coder
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: /srv/github-runner/bin/mint-coder-app-token.sh
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.coder.outputs.coder_token }}
          fetch-depth: 0      # merge bases and git merge-tree need real history
          submodules: false
          clean: true
      - name: Re-bump open PRs
        uses: bdh-org/dev-common/.github/actions/rebump-prs@main
        with:
          github-token: ${{ steps.coder.outputs.coder_token }}
          mode: push
