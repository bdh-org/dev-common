name: version-guard

# Reusable VERSION gate for repos whose CI is bespoke.
#
#   jobs:
#     version-guard:
#       uses: bdh-org/dev-common/.github/workflows/version-guard.yml@main
#
# WHAT IT IS FOR
#
# Merging to main is the deploy in this fleet, and `tag-version` fires on a
# VERSION change. A PR that changes code without moving VERSION therefore ships
# an image whose version belongs to somebody else's change, and never gets a tag.
# A PR that moves VERSION *backwards*, or onto a number another PR already took,
# collides with a build that has already shipped.
#
# ONE GATE. "Version bumped" compares this branch against its BASE. Its sibling,
# "Version claimed by another open PR", was removed by bdh-org/dev-common#344:
# open PRs now hold provisional numbers that may be shared, and the rebump job in
# tag-version moves each ready PR past main after every merge.
#
# `ci.yml` and `self-hosted-ci.yml` have carried this check inline for months, so
# the eleven repos that call one of them are covered. The repos that do NOT call
# either are not, and nothing noticed, because what is missing is a check rather
# than a passing one: bdh-org/home-infra#680 found six repos with a VERSION and no
# gate at all -- home-site, brief, home-stack-common, roy, and (despite an audit
# that said otherwise) ratecraft and ledger-io, whose ci.yml only *mentions* the
# shared workflow in a comment explaining why it is bespoke.
#
# THE GATE IS NOT A COPY ANY MORE. It is the composite action
# .github/actions/version-guard, called as a single step here and by ci.yml and
# self-hosted-ci.yml (dev-common#235, #338). The duplication they replaced had drifted twice --
# dev-common#182 tightened one copy and not the other, and #208's collision
# message landed in self-hosted-ci.yml only (dev-common#232) -- and both times
# the suite stayed green, because it compared exit codes and the divergence was
# in a message. A test can catch two files disagreeing; only one file cannot
# disagree with itself.
#
# A STEP, NOT A SIBLING JOB, at every call site: `ci / ci` is the required status
# check in nine consumer repos, and a new job would report under a context none
# of them requires. The action's header carries that and its reversal trigger.
#
# WHERE IT RUNS. ubuntu-latest. It needs no registry, no Vault, no container and
# no submodule -- just the Makefile and the base branch -- so it must not queue
# behind image builds on the serialized forge runner (bdh-org/home-infra#426).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # NAMED FOR ONE GATE, RUNS BOTH, and that is deliberate rather than stale. The
  # job key is the status CONTEXT a caller sees and may require, so renaming it to
  # match what it now does would move that context and silently un-gate every repo
  # that pinned the old one (dev-common#338). The step inside is named for both.
  version-bumped:
    # Only a pull request has a base to compare against. On push to main
    # `github.base_ref` is empty and `origin/` would name the remote itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # `git diff base...HEAD` and `git merge-base` both need real history.
          # A shallow clone has no merge base, so the guard would ERROR rather
          # than judge -- and an erroring guard is worse than no guard, because
          # it still reports a red X that looks like coverage.
          fetch-depth: 0

      # BOTH GATES, ONE STEP. They are the two steps of the composite action
      # .github/actions/version-guard, called here and by ci.yml and
      # self-hosted-ci.yml (bdh-org/dev-common#235, #338). Each was a third
      # inline copy kept byte-identical by a test; the action is what those tests
      # were tripwires for.
      #
      # The action's header carries the rest: why a composite action rather than
      # a script path, why a step rather than a sibling job, how the open-PR gate
      # gets its token, and what would reverse any of it.
      #
      # Fully qualified `@main`, never `./`: inside a `workflow_call` a relative
      # `uses:` resolves against the CALLING repo's checkout, where this action
      # does not exist.
      - name: Version guard
        if: github.event_name == 'pull_request'
        uses: bdh-org/dev-common/.github/actions/version-guard@main
