name: version-guard

# Reusable VERSION gate for repos whose CI is bespoke.
#
#   jobs:
#     version-guard:
#       uses: bdh-org/dev-common/.github/workflows/version-guard.yml@main
#
# WHAT IT IS FOR
#
# Merging to main is the deploy in this fleet, and `tag-version` fires on a
# VERSION change. A PR that changes code without moving VERSION therefore ships
# an image whose version belongs to somebody else's change, and never gets a tag.
# A PR that moves VERSION *backwards*, or onto a number another PR already took,
# collides with a build that has already shipped.
#
# TWO STEPS, because there are two ways to take a number that is not yours.
# "Version bumped" compares this branch against its BASE, which catches the
# collision only after the other PR has MERGED. "Version claimed by another open
# PR" compares against the repo's currently OPEN PRs, which is the case no single
# branch can see from its own contents: two branches cut from one main each bump
# to the same number, git merges the identical VERSION line as AGREEMENT rather
# than as a conflict, and both land (bdh-org/dev-common#255).
#
# `ci.yml` and `self-hosted-ci.yml` have carried this check inline for months, so
# the eleven repos that call one of them are covered. The repos that do NOT call
# either are not, and nothing noticed, because what is missing is a check rather
# than a passing one: bdh-org/home-infra#680 found six repos with a VERSION and no
# gate at all -- home-site, brief, home-stack-common, roy, and (despite an audit
# that said otherwise) ratecraft and ledger-io, whose ci.yml only *mentions* the
# shared workflow in a comment explaining why it is bespoke.
#
# WHY A THIRD COPY IS NOT THE ANSWER. Two copies have now drifted twice --
# dev-common#182 tightened one and not the other, and #208's collision message
# landed in self-hosted-ci.yml only (dev-common#232). This file exists so the
# repos that are being wired up now converge on ONE implementation rather than
# adding four more copies to keep in step. Converging the two existing inline
# copies onto it is a separate change, because both are steps inside an existing
# job and lifting them out changes each caller's status-check contexts.
#
# WHERE IT RUNS. ubuntu-latest. It needs no registry, no Vault, no container and
# no submodule -- just the Makefile and the base branch -- so it must not queue
# behind image builds on the serialized forge runner (bdh-org/home-infra#426).

on:
  workflow_call:

# `pull-requests: read` is for the open-PR collision step, which lists this
# repo's other open PRs. A workflow-level block here REPLACES the caller's
# grant rather than adding to it, so omitting the scope would leave that step
# permanently warning "could not list open PRs" -- a check that reports its own
# absence forever is noise, and noise gets filtered.
#
# Safe to request: a reusable workflow's permissions may not exceed its
# caller's, and tag-version.yml is a reusable that already asks every repo in
# this fleet for `contents: write`. A caller able to grant that is not on the
# restricted default, so it can grant a read scope too. The step degrades to a
# warning anyway if some future caller cannot.
permissions:
  contents: read
  pull-requests: read

jobs:
  version-bumped:
    # Only a pull request has a base to compare against. On push to main
    # `github.base_ref` is empty and `origin/` would name the remote itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # `git diff base...HEAD` and `git merge-base` both need real history.
          # A shallow clone has no merge base, so the guard would ERROR rather
          # than judge -- and an erroring guard is worse than no guard, because
          # it still reports a red X that looks like coverage.
          fetch-depth: 0

      # Kept byte-identical to the step of the same name in ci.yml and
      # self-hosted-ci.yml. tests/version-bumped.test.sh extracts this body by
      # step name and runs every case against all three files, which is what
      # actually enforces that -- a comment saying "keep these in sync" has now
      # failed twice.
      - name: Version bumped
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          if ! grep -qE '^VERSION[[:space:]]*=' Makefile 2>/dev/null; then
            echo "no VERSION in Makefile -- this repo does not version here, skipping"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          head_v=$(grep -m1 -E '^VERSION[[:space:]]*=' Makefile | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//')
          base_v=$(git show "$base:Makefile" 2>/dev/null | grep -m1 -E '^VERSION[[:space:]]*=' | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' || echo "")
          if [ -z "$base_v" ]; then
            echo "no VERSION on $base -- nothing to compare, skipping"
            exit 0
          fi
          if [ "$head_v" != "$base_v" ]; then
            # STRICTLY GREATER, not merely different (dev-common#180/#182).
            #
            # "Different" passes every branch in a parallel set: three panoptikon
            # PRs each branched from 2.12.105 and each bumped to 2.12.106, so each
            # differed from its base and each went green. The first merged and
            # tagged 2.12.106; the other two rode onto main under a version whose
            # tag pointed two commits behind them (finzeug/panoptikon#728/#729/#730).
            #
            # What `!=` alone lets through is a version that DECREASES -- which
            # cannot be tagged, and whose image tag collides with a build that has
            # already shipped.
            if [ "$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)" = "$head_v" ]; then
              echo "version bumped: $base_v -> $head_v"
              exit 0
            fi
            echo "::error::VERSION went BACKWARDS: $base_v on ${{ github.base_ref }}, $head_v here."
            echo "::error::Rebase and run 'make bump-patch' -- a version that decreases"
            echo "::error::cannot be tagged, and the image tag would collide with a build"
            echo "::error::that already shipped."
            exit 1
          fi
          changed=$(git diff --name-only "$base"...HEAD | grep -v '^Makefile$' || true)
          if [ -z "$changed" ]; then
            echo "nothing changed but the Makefile -- nothing to version"
            exit 0
          fi
          # COLLISION, not a missing bump -- and they need opposite remedies, so
          # they must not share a message. If this branch DID bump relative to the
          # point it forked from, and the base has since reached that same version,
          # then another PR merged the same number first. The author already ran
          # `make bump-patch`; telling them to run it again is the one instruction
          # that looks wrong and is right, so it has to say WHY.
          #
          # Two open PRs in one repo hit this by construction: each carries a bump
          # computed when it was opened, and whichever merges first takes the number.
          # A submodule-bump sweep that opens three PRs in a repo hits it twice.
          # (bdh-org/dev-common#208, found merging seven bump PRs on 2026-08-16.)
          #
          # NOT fixed by comparing against the merge base instead: that would pass a
          # stale bump and let two changes land on ONE version, which is the exact
          # thing this check exists to prevent -- the deployed image would report a
          # version belonging to another change.
          mb="$(git merge-base "$base" HEAD 2>/dev/null || true)"
          if [ -n "$mb" ]; then
            mb_v=$(git show "$mb:Makefile" 2>/dev/null | grep -m1 -E '^VERSION[[:space:]]*=' | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' || echo "")
            if [ -n "$mb_v" ] && [ "$head_v" != "$mb_v" ]; then
              echo "::error::VERSION COLLISION -- this PR bumped $mb_v -> $head_v, but ${{ github.base_ref }} has ALSO reached $head_v."
              echo "::error::Another PR merged that same version first. Your bump was fine; it is now taken."
              echo "::error::Re-bump on top of the updated base:"
              echo "::error::    git fetch origin ${{ github.base_ref }} && git merge origin/${{ github.base_ref }}"
              echo "::error::    make bump-patch && git push"
              echo "::error::Do NOT edit the version by hand, and do NOT re-run this job -- the"
              echo "::error::number is taken until the branch moves."
              exit 1
            fi
          fi
          echo "::error::VERSION is still $base_v but this PR changes:"
          echo "$changed" | sed 's/^/  /'
          echo "::error::Run 'make bump-patch' -- never edit the version by hand."
          echo "::error::Without a bump, tag-version.yml does not fire and the"
          echo "::error::deployed image reports a version belonging to another change."
          exit 1

      # The half of the collision that the step above CANNOT see.
      #
      # "Version bumped" compares this branch against its BASE, so it notices a
      # collision only once the other PR has MERGED -- by which time both
      # branches claimed the number and one of them is being repaired by hand.
      # While the two PRs are merely OPEN, each one's base is untouched and each
      # one is individually, verifiably correct. There is nothing for a reviewer
      # to see on either diff.
      #
      # Nor will git object. Two branches cut from the same main each run
      # `make bump-patch`, each writes the IDENTICAL VERSION line, and git merges
      # an identical edit as AGREEMENT rather than as a conflict. Both land, one
      # of the two versions silently never exists, and because tag-version.yml
      # triggers on `paths: ['Makefile']`, a bump whose Makefile ends up
      # byte-identical gets no tag either -- silent at both ends
      # (bdh-org/home-infra#617).
      #
      # Three in one afternoon, 2026-09-20, all in finzeug/heller, all repaired
      # by hand: #558 carried 1.3.268 against a main at 1.3.267; #559 was a
      # submodule bump carrying no version change at all; #563 carried 1.3.268
      # against a main already at 1.3.269. It scales with how many branches are
      # open at once, which is rising as the headless agent is used more
      # (bdh-org/dev-common#255, bdh-org/home-infra#674 and #675).
      #
      # curl AND jq, NOT `gh`. The specifying issue said "a few lines against
      # `gh pr list`". There is no `gh` on the forge self-hosted runner, and
      # self-hosted-ci.yml is what most of this fleet actually calls -- so a `gh`
      # implementation would be green on ubuntu-latest and command-not-found
      # everywhere that matters. curl and jq are present on both.
      #
      # THE LOWEST PR NUMBER WINS, and only the later PR goes red. Failing both
      # deadlocks a pair that is each other's only problem, and blocks the PR
      # that did nothing wrong. The tiebreak needs no stored state and reads the
      # same way from either side.
      #
      # A TOKEN THAT CANNOT LIST PRs WARNS RATHER THAN FAILS. This reusable is
      # consumed at @main by the whole fleet, so a hard failure here would turn
      # every caller red at once over a permission none of them had been asked
      # for. The warning names the exact remedy instead. It is still never a
      # SILENT pass: every path prints what it concluded.
      - name: Version claimed by another open PR
        if: github.event_name == 'pull_request'
        env:
          # Via env, never interpolated into the command line. A token in argv
          # is visible in process listings and in the log's own command echo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          if ! grep -qE '^VERSION[[:space:]]*=' Makefile 2>/dev/null; then
            echo "no VERSION in Makefile -- this repo does not version here, skipping"
            exit 0
          fi
          head_v=$(grep -m1 -E '^VERSION[[:space:]]*=' Makefile \
            | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' | tr -d ' \r')
          if [ -z "$head_v" ]; then
            echo "VERSION line is empty -- nothing to compare, skipping"
            exit 0
          fi

          pr="${{ github.event.pull_request.number }}"
          base="${{ github.base_ref }}"
          repo="${GITHUB_REPOSITORY:-}"
          api="${GITHUB_API_URL:-https://api.github.com}"

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::warning::No GITHUB_TOKEN, so this repo's other open PRs cannot be"
            echo "::warning::listed and a version one of them already claims will NOT be"
            echo "::warning::detected. Add to the job that calls this workflow:"
            echo "::warning::    permissions:"
            echo "::warning::      pull-requests: read"
            exit 0
          fi
          case "$pr" in
            ''|*[!0-9]*)
              echo "::warning::PR number '$pr' is not numeric -- skipping the open-PR check."
              exit 0 ;;
          esac
          if [ -z "$repo" ] || [ -z "$base" ]; then
            echo "::warning::No repository/base context -- skipping the open-PR check."
            exit 0
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # `base=` narrows to PRs targeting the same branch: a PR aimed at some
          # other base is not competing for this lineage's next number.
          if ! status=$(curl -sS -o "$tmp/prs.json" -w '%{http_code}' \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/repos/$repo/pulls?state=open&base=$base&per_page=100" \
                2>"$tmp/err"); then
            status="000"
          fi
          if [ "$status" != "200" ]; then
            # The SERVER's own words, never a parser's. A 403 reading "Resource
            # not accessible by integration" ends this in one step; a jq error
            # about a missing key sends the reader somewhere else entirely.
            echo "::warning::Could not list open PRs (HTTP $status). The server said:"
            head -c 400 "$tmp/err" 2>/dev/null | sed 's/^/  /' || true
            head -c 400 "$tmp/prs.json" 2>/dev/null | sed 's/^/  /' || true
            echo ""
            echo "::warning::Most likely the calling job lacks 'pull-requests: read'."
            echo "::warning::A version already claimed by an open PR was NOT checked."
            exit 0
          fi

          if ! others=$(jq -r --argjson me "$pr" '
                .[] | select(.number != $me)
                    | [ (.number|tostring), .head.sha,
                        (.draft|tostring), .title ] | @tsv
                ' "$tmp/prs.json" 2>"$tmp/jqerr"); then
            echo "::warning::Could not parse the open-PR list:"
            sed 's/^/  /' "$tmp/jqerr" 2>/dev/null || true
            echo "::warning::A version already claimed by an open PR was NOT checked."
            exit 0
          fi
          if [ -z "$others" ]; then
            echo "no other open PR against $base -- $head_v is uncontested"
            exit 0
          fi

          # A DRAFT still counts. It holds the number and can be marked ready at
          # any moment, so excluding drafts would reintroduce the silent
          # collision this step exists to remove. It is labelled, so the author
          # can judge whether to chase it.
          earliest=""
          lower=""
          higher=""
          while IFS="$(printf '\t')" read -r n sha draft title; do
            [ -n "${n:-}" ] || continue
            if ! st=$(curl -sS -o "$tmp/mk" -w '%{http_code}' \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.raw" \
                  "$api/repos/$repo/contents/Makefile?ref=$sha" \
                  2>/dev/null); then
              st="000"
            fi
            if [ "$st" != "200" ]; then
              echo "  PR #$n: no readable Makefile at $sha (HTTP $st) -- not compared"
              continue
            fi
            v=$(grep -m1 -E '^VERSION[[:space:]]*=' "$tmp/mk" 2>/dev/null \
              | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' | tr -d ' \r' || true)
            if [ -z "$v" ]; then
              echo "  PR #$n: no VERSION line -- not compared"
              continue
            fi
            if [ "$v" != "$head_v" ]; then
              echo "  PR #$n: $v -- no collision"
              continue
            fi
            label="#$n"
            if [ "$draft" = "true" ]; then
              label="$label (draft)"
            fi
            title=$(printf '%.60s' "$title")
            if [ "$n" -lt "$pr" ]; then
              lower="${lower}PR ${label} already claims ${head_v}: ${title}"$'\n'
              if [ -z "$earliest" ] || [ "$n" -lt "$earliest" ]; then
                earliest="$n"
              fi
            else
              higher="${higher}PR ${label} also carries ${head_v}: ${title}"$'\n'
            fi
          done <<< "$others"

          if [ -n "$lower" ]; then
            echo "::error::VERSION COLLISION WITH AN OPEN PR -- this PR carries $head_v, and so does:"
            printf '%s' "$lower" | sed 's/^/::error::  /'
            echo "::error::"
            echo "::error::Both branches were cut from the same $base and each ran"
            echo "::error::'make bump-patch', so each computed the SAME next number. git"
            echo "::error::merges two identical VERSION lines as AGREEMENT rather than as a"
            echo "::error::conflict, so nothing would stop both landing -- and one of the two"
            echo "::error::versions would silently never exist."
            echo "::error::"
            echo "::error::PR #$earliest opened first, so it keeps $head_v and THIS PR re-bumps:"
            echo "::error::    git fetch origin $base && git merge origin/$base"
            echo "::error::    make bump-patch && git push"
            echo "::error::"
            echo "::error::Do NOT edit the version by hand, and do NOT simply re-run this job"
            echo "::error::-- the number stays taken until this branch moves."
            exit 1
          fi

          if [ -n "$higher" ]; then
            # Reported, not failed: this PR opened first, so it keeps the number
            # and the other one re-bumps. That PR's own run is where it is red.
            echo "::warning::Another open PR carries $head_v as well:"
            printf '%s' "$higher" | sed 's/^/::warning::  /'
            echo "::warning::This PR opened first, so it keeps $head_v and the other re-bumps."
            echo "::warning::Nothing to do here."
          fi

          echo "no earlier open PR claims $head_v"
