name: submodule-bump (wrapper)
# Thin wrapper (home-infra#362): owns the TRIGGER and nothing else. When dev-common's main
# moves, sweep every repo that pins it and open (or force-refresh) one PR per consumer that
# moves the pointer forward.
#
# The pipeline itself is home-infra's reusable -- same reusable-plus-wrapper shape as the
# agent pipeline and tag-version, but pointing at home-infra rather than at this repo,
# because the sweep is driven by an EXPECTED LIST of consumers
# (home-infra/scripts/fleet-consumers.txt) and that list is home-site-stack membership.
# dev-common is deliberately stack-AGNOSTIC -- the dev tooling every project across every
# stack pins -- so it must not learn the names of one stack's repos. That is P3, applied
# here rather than argued about later.
#
# WHY THE SOURCE AND NOT THE CONSUMER: the source is the only party that knows it changed.
# A consumer cannot notice something it has not fetched, which is why `common` sat 1-3
# commits behind fleet-wide and `stack-common` sat 16 commits and 30 days behind across ten
# repos -- one had a tool that a human remembered to run, the other had nothing.
#
# NOTHING IS MERGED. The sweep opens PRs and stops. Merging a bump is a deploy
# (home-infra#348), so it stays a human act.
#
# The daily backstop schedule lives in home-infra's workflow, not here: it sweeps BOTH
# sources, so it also covers a source repo whose wrapper was never installed.
#
# PREREQUISITE, one time: home-infra is private, so its Settings -> Actions -> General ->
# Access must allow "Accessible from repositories in the bdh-org organization" or this
# wrapper fails at workflow resolution.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: clone, move the pointer, run make bump-patch — push nothing"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: submodule-bump-dev-common
  cancel-in-progress: false

jobs:
  sweep:
    uses: bdh-org/home-infra/.github/workflows/submodule-bump.yml@main
    with:
      source: bdh-org/dev-common
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit
