name: agent-pr-review
# Thin wrapper (bdh-org/home-infra#1188): the triggers and the trust filter live here; the
# reviewer itself is the reusable in dev-common (bdh-org/dev-common#283). Grok
# Build reads the PR and posts ONE advisory COMMENT review as bdh-org-reviewer[bot].
#
# Two ways to ask for a review:
#   - add the `agent-review` label to a PR (labelling already needs triage access);
#   - comment `/grok-review` on a PR, as a trusted author.
# A new push does NOT re-review on its own; ask again.
on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read         # check out the PR head
  pull-requests: read    # resolve the PR; the review is posted with the App's own token

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' && github.event.label.name == 'agent-review') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/grok-review') &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.id == 333881240))
    # dev-common's OWN PRs run the reusable FROM THE PR: a local path resolves against
    # the PR's merge ref, so a change to the reviewer is exercised by itself before it
    # goes live for every caller at @main (bdh-org/home-infra#1255). The grok-install
    # action inside it is still fetched at @main, so a pin bump is only measured after
    # merge. Other repos keep `bdh-org/dev-common/.github/workflows/agent-pr-review.yml@main`.
    # Job-level, under the if: a run the filter skips (any other label, any PR
    # comment) never takes the group, so it cannot cancel a review in flight; the
    # reviewer's own /revise comment did exactly that at workflow level
    # (bdh-org/home-infra#1258). A second request on the same PR still replaces it.
    concurrency:
      group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/agent-pr-review.yml
    secrets: inherit
