name: Self-hosted CI

# Reusable CI workflow that runs on the forge self-hosted runner.
# Consumers add a thin wrapper:
#
#   jobs:
#     ci:
#       uses: bdh-org/dev-common/.github/workflows/self-hosted-ci.yml@main
#       with:
#         conda-env-name: <repo>-ci
#         run-tests: true            # false for repos with no tests/
#         full-env: true             # false -> minimal ruff-only env via .github/ci-environment.yml
#
# Per-repo differences live in the repo (its conda-packages.txt / ci-environment.yml
# and the wrapper inputs), never as branches inside this file.
#
# The caller repo must set the VAULT_ADDR variable: EVERY submodule here is a
# cross-repo fetch (`common` is bdh-org/dev-common whoever calls), and
# GITHUB_TOKEN is scoped to the calling repo alone -- so hydration mints an org
# App token per submodule org via Vault.
on:
  workflow_call:
    inputs:
      conda-env-name:
        description: Per-repo conda env name (avoids collisions under the shared github-runner user)
        type: string
        required: true
      full-env:
        description: true -> `make env` (full deps, needed when tests import the package); false -> minimal ruff-only env from ci-env-file
        type: boolean
        default: true
      run-tests:
        description: Run pytest after lint
        type: boolean
        default: true
      test-path:
        type: string
        default: tests/
      extra-submodules:
        description: >
          Space-separated submodule paths to init and pip-install beyond `common`,
          e.g. "lib/ratecraft lib/ledger-io". ORDER MATTERS: they are installed
          left to right, so a dependency comes before its dependent. Empty (the
          default) leaves every existing consumer untouched.

          They may live in any org -- the hydration step mints a token per org
          named in .gitmodules, not per caller org (dev-common#170).
        type: string
        default: ""
      ci-env-file:
        description: Minimal conda env file, used only when full-env is false
        type: string
        default: .github/ci-environment.yml

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, forge]
    env:
      CI_ENV: ${{ inputs.conda-env-name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: false      # nested cross-org submodules need explicit auth
          # The version-bump guard below diffs against the base branch, which
          # needs more than the default shallow clone.
          fetch-depth: 0
          clean: true            # default: git reset --hard && git clean -ffdx

      # Hydrate `common` plus the caller's extras, each with a token minted for
      # ITS OWN org, read out of its URL in .gitmodules -- never from the caller
      # repo's org (dev-common#170). GITHUB_TOKEN is scoped to THIS repo, so it
      # cannot read a sibling repo, which is what every cross-repo submodule is;
      # the coder App is installed in every org and mints a ~1h installation
      # token per org (home-infra#91).
      #
      # `common` is ALWAYS bdh-org/dev-common however finzeug the caller is, and
      # panoptikon / heller / slingshot vendor finzeug's lib/ledger-io +
      # lib/ratecraft alongside bdh-org's common + stack-common. So neither the
      # caller's org nor a hardcoded bdh-org is the right signal for any of them
      # -- only the URL is. dev-common#169 fixed exactly this in the agent
      # workflows, where it pointed the other way; sm_map/sm_org below are that
      # fix's functions, verbatim (tests/ci-submodules.test.sh enforces that).
      #
      # Deliberately NOT --recursive, and deliberately a SELECTED path list: the
      # step below deinits everything else first, so a test guarded on "is this
      # submodule checked out?" cannot silently run against whatever an earlier
      # agent job left on the shared workspace (finzeug/heller#356).
      - name: Hydrate the selected submodules (per-submodule org tokens)
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          EXTRA: ${{ inputs.extra-submodules }}
        run: |
          set -euo pipefail
          MINT="${MINT:-/srv/github-runner/bin/mint-coder-app-token.sh}"

          # path<TAB>url for every submodule any .gitmodules on disk declares. Nested
          # paths are printed parent-prefixed, exactly the way `git submodule status
          # --recursive` reports them, so the check at the end can look a path up here.
          sm_map() {
            local f dir k p u
            while IFS= read -r f; do
              case "$f" in */.gitmodules) dir="${f%.gitmodules}";; *) dir="";; esac
              while IFS= read -r k; do
                p="$(git config -f "$f" --get "$k")" || continue
                u="$(git config -f "$f" --get "${k%.path}.url")" || u=""
                printf '%s\t%s\n' "${dir}${p}" "$u"
              done < <(git config -f "$f" --name-only --get-regexp '^submodule\..*\.path$' 2>/dev/null || true)
            done < <(find . -name .gitmodules -not -path './.git/*' -printf '%P\n' | sort)
          }

          # The GitHub org owning a submodule URL; empty for anything else -- a relative
          # or non-GitHub URL needs no token of ours and must not cost a mint attempt.
          sm_org() {
            printf '%s\n' "$1" | sed -nE 's#^(https://github\.com/|git@github\.com:)([^/]+)/.*#\2#p'
          }

          # tests/ci-submodules.test.sh sources everything above and stops here.
          if [ -n "${HYDRATE_LIB_ONLY:-}" ]; then return 0; fi

          # Drop any submodule an earlier job left behind, then init only what
          # this workflow wants.
          #
          # checkout's clean:true runs `git reset --hard && git clean -ffdx`, and
          # NEITHER touches a populated submodule: its contents are a tracked
          # gitlink, not untracked files, and reset does not recurse. Verified --
          # after reset+clean a submodule stays populated AND at whatever commit
          # it was left on.
          #
          # forge's _work/<repo>/<repo> is shared by every workflow for that repo,
          # and agent-issue-to-pr / agent-pr-revise (also runs-on forge) init
          # `--recursive`. So one agent run leaves every submodule on disk, and
          # every later CI job inherits them at an arbitrary commit.
          #
          # `common` is kept rather than deinited-and-refetched: it is wanted
          # anyway, and re-cloning it on every job across the fleet is pure cost.
          keep="common ${EXTRA:-}"
          git submodule status 2>/dev/null | awk '{print $2}' \
            | grep -vxF -f <(printf '%s\n' $keep) \
            | xargs -r git submodule deinit -f -- 2>/dev/null || true

          # The map is read AFTER the deinit, so a nested .gitmodules belonging to
          # a submodule this workflow does not want is gone before it can name an
          # org nobody here needs a token for.
          MAP="$(sm_map)"

          WANT=()
          for p in $keep; do
            if printf '%s\n' "$MAP" | cut -f1 | grep -qxF -- "$p"; then
              WANT+=("$p")
            else
              echo "::warning::${p} is not a submodule of this repo -- skipping"
            fi
          done
          if [ "${#WANT[@]}" -eq 0 ]; then
            echo "no submodules to hydrate"
            exit 0
          fi

          # Credential rewrites an earlier job on this persistent runner left behind
          # (its token is long expired, and it would shadow the ones minted below).
          for k in $(git config --local --name-only --get-regexp '^url\.' || true); do
            git config --local --unset-all "$k" || true
          done
          # sync FIRST: the persistent runner workspace keeps submodule URLs in
          # .git/modules/*/config and `submodule init` never overwrites them, so
          # a URL corrected in .gitmodules would otherwise stay broken forever
          # (bdh-org/dev-common#105).
          git submodule sync -- "${WANT[@]}" || true

          CFG=()
          minted=""

          mint() { # org -> append an insteadOf rewrite carrying a token for that org
            local org="$1" out tok
            out="$(mktemp "${RUNNER_TEMP:-/tmp}/hydrate-XXXXXX")"
            # The mint script masks its token by printing ::add-mask:: on STDOUT, so
            # stdout must reach the job log; the value itself only lands in $out, never
            # in a step output (a hydration token is nobody else's business).
            if ! GITHUB_OUTPUT="$out" CODER_TOKEN_ENV_NAME="" "$MINT" "$org"; then
              rm -f "$out"; return 1
            fi
            tok="$(sed -n 's/^coder_token=//p' "$out" | head -1)"
            rm -f "$out"
            [ -n "$tok" ] || return 1
            CFG+=(-c "url.https://x-access-token:${tok}@github.com/${org}/.insteadOf=https://github.com/${org}/")
          }

          for p in "${WANT[@]}"; do
            url="$(printf '%s\n' "$MAP" | awk -F'\t' -v p="$p" '$1 == p {print $2; exit}')"
            org="$(sm_org "$url")"
            [ -n "$org" ] || continue
            case " $minted " in *" $org "*) continue;; esac
            minted="$minted $org"
            # Tolerant: a repo whose VAULT_ADDR variable is unset cannot mint, and
            # the checkout credential still covers a same-repo submodule. The check
            # below is the only thing that decides this step.
            mint "$org" || echo "::warning::could not mint a ${org} token -- falling back to the checkout credential"
          done

          # --force is LOAD-BEARING (dev-common#176). Without it, `submodule update --init`
          # is a NO-OP whenever the module HEAD already equals the pin -- it never looks at
          # the working tree. On this persistent runner an earlier job can leave a submodule
          # directory emptied of tracked files while .git and HEAD survive, and every later
          # hydration then "succeeds" against an empty directory. --force checks the tree out
          # regardless. Verified: plain update does not restore the files, --force does.
          git ${CFG[@]+"${CFG[@]}"} submodule update --init --force -- "${WANT[@]}" || true

          # Fail LOUDLY, naming the submodule and the org it needed. A submodule this
          # workflow asked for and did not populate must never be handed on as an
          # empty directory for `make lint` to trip over 40 lines from the cause
          # (home-infra#343, home-infra#359). `submodule status` prefixes '-' for one
          # never initialised and '+' for one left at a commit other than the pin --
          # and '+' is how this bug hid, a stale checkout on the persistent runner
          # standing in for a fetch that never happened.
          # `submodule status` is NOT sufficient on its own, which is how this got past the
          # first version of this guard. It reports a path CLEAN when .git exists and HEAD
          # matches the pin, even with every tracked file deleted -- reproduced directly:
          # remove the files, keep .git, and status prints a leading space, not '-' or '+'.
          # So ask the WORKING TREE whether it holds anything, which is the question pip and
          # `make lint` are really asking two steps later.
          bad="$(git submodule status -- "${WANT[@]}" 2>/dev/null | grep -E '^[-+]' || true)"
          for _p in "${WANT[@]}"; do
            # Anything other than .git itself counts as populated.
            if [ -z "$(ls -A "$_p" 2>/dev/null | grep -vx '.git' || true)" ]; then
              bad="${bad}"$'\n'" ${_p}"
              echo "::error::${_p} is checked out at its pin but its working tree is EMPTY"
            fi
          done
          bad="$(printf '%s\n' "$bad" | sed '/^[[:space:]]*$/d')"
          if [ -n "$bad" ]; then
            echo "::error::submodule hydration incomplete -- refusing to run CI against a partial checkout"
            while read -r rev path _; do
              [ -n "${path:-}" ] || continue
              url="$(printf '%s\n' "$MAP" | awk -F'\t' -v p="$path" '$1 == p {print $2; exit}')"
              org="$(sm_org "$url")"
              case "$rev" in -*) why="never initialised";; *) why="not at the pinned commit";; esac
              echo "::error::  ${path}: ${why} -- url ${url:-unknown}, org ${org:-unknown}"
            done <<< "$bad"
            echo "If the org is right, check that the bdh-org-coder App is installed there" >&2
            echo "(Vault kv/ai/coder/github-app needs an install_<org> field for it)," >&2
            echo "and that this repo sets the VAULT_ADDR variable." >&2
            exit 1
          fi
          git submodule status -- "${WANT[@]}" | sed 's/^/  /'
          echo "submodule hydration OK"

      # Point CONDA_ROOT at the runner's REAL home rather than a hardcoded path:
      # github-runner's home isn't the assumed /home/github-runner on forge (it's
      # /srv/github-runner), and hardcoding forces a phantom dir. $HOME is the
      # runner user's home, so conda lives at <home>/miniforge3 -- portable across hosts.
      - name: Resolve CONDA_ROOT from the runner's home
        run: echo "CONDA_ROOT=$HOME/miniforge3" >> "$GITHUB_ENV"

      # The conda env persists on the runner's disk between runs -- that IS the
      # cache. Rebuild only when its inputs change, keyed on a hash stored in
      # the env dir. full-env hashes conda-packages.txt + the shared base list;
      # minimal mode hashes the ci-env-file.
      - name: Set up conda env (cached on disk)
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          envpath="$CONDA_ROOT/envs/$CI_ENV"
          # Bump CACHE_VERSION to force a rebuild of every CI env on disk.
          CACHE_VERSION=v4
          if [ "${{ inputs.full-env }}" = "true" ]; then
            key=$( { echo "$CACHE_VERSION"; cat conda-packages.txt requirements-prod.txt common/devcontainer/base-conda-packages.txt 2>/dev/null; } | sha256sum | cut -d' ' -f1)
          else
            key=$( { echo "$CACHE_VERSION"; cat "${{ inputs.ci-env-file }}"; } | sha256sum | cut -d' ' -f1)
          fi
          have=$(cat "$envpath/.envhash" 2>/dev/null || true)
          if [ ! -d "$envpath" ] || [ "$key" != "$have" ]; then
            if [ "${{ inputs.full-env }}" = "true" ]; then
              # Build the named env directly with `-n` (base conda binary, no
              # activation). We do NOT call `make env`: it's written for the
              # devcontainer where everything installs into base, and its
              # CONDA_PREFIX usage fights a per-repo named env. This mirrors
              # make env's inputs: shared base list + the repo's conda-packages
              # + the CI-relevant dev tools.
              echo "Building/updating full env $CI_ENV"
              conda create -y -n "$CI_ENV" || true
              conda install -y -n "$CI_ENV" --file common/devcontainer/base-conda-packages.txt
              if [ -f conda-packages.txt ]; then
                conda install -y -n "$CI_ENV" --file conda-packages.txt
              fi
              conda install -y -n "$CI_ENV" ruff pytest pytest-cov
              # Also pip-install prod requirements: conda-packages.txt is the dev
              # convenience list and can miss pip-only deps (e.g. fred-py-api,
              # not on conda-forge). requirements-prod.txt is the authoritative
              # runtime set and its pins match the conda versions, so this is
              # mostly a no-op except for the genuinely pip-only packages.
              if [ -f requirements-prod.txt ]; then
                conda run -n "$CI_ENV" pip install -r requirements-prod.txt
              fi
            else
              echo "Building/updating minimal env $CI_ENV from ${{ inputs.ci-env-file }}"
              conda env update -n "$CI_ENV" -f "${{ inputs.ci-env-file }}" --prune
            fi
            echo "$key" > "$envpath/.envhash"
          else
            echo "conda env $CI_ENV up to date (cache hit: $key)"
          fi

      # Vendored siblings install from lib/ rather than PyPI, so requirements-prod
      # deliberately omits them -- which meant every code path behind them was
      # invisible to CI, degrading to a warning rather than a failure
      # (finzeug/panoptikon#648).
      - name: Install the extra submodules into the env
        if: inputs.extra-submodules != ''
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate "$CI_ENV"
          pip install ${{ inputs.extra-submodules }}

      - name: Version consistency
        run: make version-check

      # Same guard as the hosted workflow (bdh-org/dev-common#124). It has to be
      # in BOTH: the incident that motivated it -- finzeug/panoptikon#569 merging
      # on a version #567 had already tagged -- happened in a repo that uses THIS
      # workflow, so putting the guard only in ci.yml would have missed its own
      # motivating case.
      #
      # version-check above tests INTERNAL consistency (Makefile VERSION against
      # __init__.py / package.json) and has no notion of a base branch, so it
      # passes on a PR that changed code and forgot to bump.
      - name: Version bumped
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          if ! grep -qE '^VERSION[[:space:]]*=' Makefile 2>/dev/null; then
            echo "no VERSION in Makefile -- this repo does not version here, skipping"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          head_v=$(grep -m1 -E '^VERSION[[:space:]]*=' Makefile | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//')
          base_v=$(git show "$base:Makefile" 2>/dev/null | grep -m1 -E '^VERSION[[:space:]]*=' | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' || echo "")
          if [ -z "$base_v" ]; then
            echo "no VERSION on $base -- nothing to compare, skipping"
            exit 0
          fi
          if [ "$head_v" != "$base_v" ]; then
            echo "version bumped: $base_v -> $head_v"
            exit 0
          fi
          changed=$(git diff --name-only "$base"...HEAD | grep -v '^Makefile$' || true)
          if [ -z "$changed" ]; then
            echo "nothing changed but the Makefile -- nothing to version"
            exit 0
          fi
          echo "::error::VERSION is still $base_v but this PR changes:"
          echo "$changed" | sed 's/^/  /'
          echo "::error::Run 'make bump-patch' -- never edit the version by hand."
          echo "::error::Without a bump, tag-version.yml does not fire and the"
          echo "::error::deployed image reports a version belonging to another change."
          exit 1

      - name: Lint
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate "$CI_ENV"
          make lint

      - name: Test
        if: ${{ inputs.run-tests }}
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate "$CI_ENV"
          python -m pytest -vv "${{ inputs.test-path }}"
