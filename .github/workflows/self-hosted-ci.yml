name: Self-hosted CI

# Reusable CI workflow that runs on the forge self-hosted runner.
# Consumers add a thin wrapper:
#
#   jobs:
#     ci:
#       uses: bdh-org/dev-common/.github/workflows/self-hosted-ci.yml@main
#       with:
#         conda-env-name: <repo>-ci
#         run-tests: true            # false for repos with no tests/
#         full-env: true             # false -> minimal ruff-only env via .github/ci-environment.yml
#         marimo-pages: src/<pkg>/pages   # omit unless the repo HAS marimo pages
#
# Per-repo differences live in the repo (its conda-packages.txt / ci-environment.yml
# and the wrapper inputs), never as branches inside this file.
#
# The caller repo must set the VAULT_ADDR variable: EVERY submodule here is a
# cross-repo fetch (`common` is bdh-org/dev-common whoever calls), and
# GITHUB_TOKEN is scoped to the calling repo alone -- so hydration mints an org
# App token per submodule org via Vault.
on:
  workflow_call:
    inputs:
      conda-env-name:
        description: Per-repo conda env name (avoids collisions under the shared github-runner user)
        type: string
        required: true
      full-env:
        description: true -> `make env` (full deps, needed when tests import the package); false -> minimal ruff-only env from ci-env-file
        type: boolean
        default: true
      run-tests:
        description: Run pytest after lint
        type: boolean
        default: true
      test-path:
        type: string
        default: tests/
      marimo-pages:
        description: >
          One path -- a directory of marimo pages, or a single page file -- to run
          common/scripts/marimo-graph-check.py over, e.g. "src/panoptikon/pages".
          Empty (the default) SKIPS the step, so every existing caller is untouched.

          The check is static and stdlib-only: it proves the notebook's dataflow
          graph is legal (no name defined by two cells, no reference no cell
          defines, no cell marimo failed to parse). Those are the defects that
          cannot be seen from outside -- a page whose graph is illegal renders
          nothing behind an HTTP 200 and may log nothing at all
          (bdh-org/home-infra#394). It runs straight after hydration rather than
          after the conda env, because it needs neither the env nor marimo itself,
          and a page repo should not wait minutes to be told its graph is broken.

          It does NOT prove a cell produces output. That is the other half, and it
          belongs in the repo's own suite via `app.run()`, where marimo is
          installed (finzeug/panoptikon#744).

          ONE path, not a list: the value is passed as a single quoted argument, so
          a space-separated pair becomes one path that does not exist and fails
          discovery (exit 2). Point it at the directory that contains the pages.
        type: string
        default: ""
      extra-submodules:
        description: >
          Space-separated submodule paths to init and pip-install beyond `common`,
          e.g. "lib/ratecraft lib/ledger-io". ORDER MATTERS: they are installed
          left to right, so a dependency comes before its dependent. Empty (the
          default) leaves every existing consumer untouched.

          They may live in any org -- the hydration step mints a token per org
          named in .gitmodules, not per caller org (dev-common#170).

          Every path here is pip-installed, so every path here must be an
          installable Python package. For a sibling wanted only for the FILES it
          carries, use `data-submodules`.
        type: string
        default: ""
      data-submodules:
        description: >
          Space-separated submodule paths to hydrate and NOT install, e.g.
          "lib/refdims". For a sibling whose value to the tests is its version-
          controlled DATA rather than any importable code -- a P2c data service's
          seed CSVs, a fixtures repo.

          `extra-submodules` cannot do this: it pip-installs everything it
          hydrates, and a repo with no pyproject.toml fails that install. So the
          seed a repo already vendors stayed unreachable from CI, and every test
          that reads it skipped (finzeug/slingshot#167).

          Hydration is identical to `extra-submodules` -- same per-org tokens,
          same emptied-worktree check, same deinit of everything unlisted, at
          any depth. Only the install differs, so order does not matter here.
        type: string
        default: ""
      test-env:
        description: >
          Newline-separated KEY=VALUE pairs exported for the test step only, e.g.
          "REFDIMS_SEED_DIR=lib/refdims/seed". For pointing a suite at data this
          workflow hydrated: a test guarded on an env var it can now satisfy runs
          instead of skipping.

          Values are taken LITERALLY -- there is no shell expansion, so a
          `$GITHUB_WORKSPACE` in one stays that text rather than becoming the
          path. A relative path is what you want anyway: the test step runs in
          the workspace root.
        type: string
        default: ""
      ci-env-file:
        description: Minimal conda env file, used only when full-env is false
        type: string
        default: .github/ci-environment.yml

# `pull-requests: read` is for the open-PR collision step, which lists this
# repo's other open PRs. A workflow-level block here REPLACES the caller's
# grant rather than adding to it, so omitting the scope would leave that step
# permanently warning "could not list open PRs" -- a check that reports its own
# absence forever is noise, and noise gets filtered.
#
# Safe to request: a reusable workflow's permissions may not exceed its
# caller's, and tag-version.yml is a reusable that already asks every repo in
# this fleet for `contents: write`. A caller able to grant that is not on the
# restricted default, so it can grant a read scope too. The step degrades to a
# warning anyway if some future caller cannot.
permissions:
  contents: read
  pull-requests: read

# Cancel a PR's previous run when a new commit supersedes it.
#
# The forge runner is a SINGLE runner: one job at a time, fleet-wide. Measured
# across 81 self-hosted jobs, they wait far longer than they run -- queue median
# 70s and p90 471s against a duration median of 14s. A superseded run holds that
# one slot to completion while the run that matters waits behind it.
#
# This got sharper the moment branch protection landed with `strict: true`
# (rolled out 2026-08-14/15; recorded in bdh-org/home-infra#414's comments,
# and tracked for drift by #623): every merge to main makes every other open PR
# out-of-date, so each one is re-pushed, and without this each re-push leaves its
# predecessor occupying the runner. A sweep that opens fourteen bump PRs turns
# one merge into fourteen doomed runs ahead of the fourteen real ones.
#
# `github.repository` is in the key on purpose: inside a reusable workflow these
# context values are the CALLER's, so omitting it would let one repo's push cancel
# another repo's run.
#
# Cancellation is limited to pull_request. A push to main is a BUILD AND DEPLOY
# (P10), and cancelling one mid-flight can leave a service on a half-pulled image;
# those must always run to completion, however many queue up.
concurrency:
  group: self-hosted-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: [self-hosted, forge]
    env:
      CI_ENV: ${{ inputs.conda-env-name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: false      # nested cross-org submodules need explicit auth
          # The version-bump guard below diffs against the base branch, which
          # needs more than the default shallow clone.
          fetch-depth: 0
          clean: true            # default: git reset --hard && git clean -ffdx

      # Hydrate `common` plus the caller's extras, each with a token minted for
      # ITS OWN org, read out of its URL in .gitmodules -- never from the caller
      # repo's org (dev-common#170). GITHUB_TOKEN is scoped to THIS repo, so it
      # cannot read a sibling repo, which is what every cross-repo submodule is;
      # the coder App is installed in every org and mints a ~1h installation
      # token per org (home-infra#91).
      #
      # `common` is ALWAYS bdh-org/dev-common however finzeug the caller is, and
      # panoptikon / heller / slingshot vendor finzeug's lib/ledger-io +
      # lib/ratecraft alongside bdh-org's common + stack-common. So neither the
      # caller's org nor a hardcoded bdh-org is the right signal for any of them
      # -- only the URL is. dev-common#169 fixed exactly this in the agent
      # workflows, where it pointed the other way; sm_map/sm_org below are that
      # fix's functions, verbatim (tests/ci-submodules.test.sh enforces that).
      #
      # Deliberately NOT --recursive, and deliberately a SELECTED path list: the
      # step below deinits everything else first, so a test guarded on "is this
      # submodule checked out?" cannot silently run against whatever an earlier
      # agent job left on the shared workspace (finzeug/heller#356). A submodule
      # nested inside a path this run KEEPS is swept after hydration rather than
      # before, because that is the only point it exists at
      # (bdh-org/dev-common#306).
      - name: Hydrate the selected submodules (per-submodule org tokens)
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          EXTRA: ${{ inputs.extra-submodules }}
          DATA_ONLY: ${{ inputs.data-submodules }}
        run: |
          set -euo pipefail
          MINT="${MINT:-/srv/github-runner/bin/mint-coder-app-token.sh}"

          # path<TAB>url for every submodule any .gitmodules on disk declares. Nested
          # paths are printed parent-prefixed, exactly the way `git submodule status
          # --recursive` reports them, so the check at the end can look a path up here.
          sm_map() {
            local f dir k p u
            while IFS= read -r f; do
              case "$f" in */.gitmodules) dir="${f%.gitmodules}";; *) dir="";; esac
              while IFS= read -r k; do
                p="$(git config -f "$f" --get "$k")" || continue
                u="$(git config -f "$f" --get "${k%.path}.url")" || u=""
                printf '%s\t%s\n' "${dir}${p}" "$u"
              done < <(git config -f "$f" --name-only --get-regexp '^submodule\..*\.path$' 2>/dev/null || true)
            done < <(find . -name .gitmodules -not -path './.git/*' -printf '%P\n' | sort)
          }

          # The GitHub org owning a submodule URL; empty for anything else -- a relative
          # or non-GitHub URL needs no token of ours and must not cost a mint attempt.
          sm_org() {
            printf '%s\n' "$1" | sed -nE 's#^(https://github\.com/|git@github\.com:)([^/]+)/.*#\2#p'
          }

          # tests/ci-submodules.test.sh sources everything above and stops here.
          if [ -n "${HYDRATE_LIB_ONLY:-}" ]; then return 0; fi

          # Drop any submodule an earlier job left behind, then init only what
          # this workflow wants.
          #
          # checkout's clean:true runs `git reset --hard && git clean -ffdx`, and
          # NEITHER touches a populated submodule: its contents are a tracked
          # gitlink, not untracked files, and reset does not recurse. Verified --
          # after reset+clean a submodule stays populated AND at whatever commit
          # it was left on.
          #
          # forge's _work/<repo>/<repo> is shared by every workflow for that repo,
          # and agent-issue-to-pr / agent-pr-revise (also runs-on forge) init
          # `--recursive`. So one agent run leaves every submodule on disk, and
          # every later CI job inherits them at an arbitrary commit.
          #
          # `common` is kept rather than deinited-and-refetched: it is wanted
          # anyway, and re-cloning it on every job across the fleet is pure cost.
          # Hydration does not care which of the two lists a path came from --
          # only the install step below does.
          keep="common ${EXTRA:-} ${DATA_ONLY:-}"
          git submodule status 2>/dev/null | awk '{print $2}' \
            | grep -vxF -f <(printf '%s\n' $keep) \
            | xargs -r git submodule deinit -f -- 2>/dev/null || true

          # The map is read AFTER the deinit, so a nested .gitmodules belonging to
          # a submodule this workflow does not want is gone before it can name an
          # org nobody here needs a token for.
          MAP="$(sm_map)"

          WANT=()
          for p in $keep; do
            if printf '%s\n' "$MAP" | cut -f1 | grep -qxF -- "$p"; then
              WANT+=("$p")
            else
              echo "::warning::${p} is not a submodule of this repo -- skipping"
            fi
          done
          if [ "${#WANT[@]}" -eq 0 ]; then
            echo "no submodules to hydrate"
            exit 0
          fi

          # Credential rewrites an earlier job on this persistent runner left behind
          # (its token is long expired, and it would shadow the ones minted below).
          for k in $(git config --local --name-only --get-regexp '^url\.' || true); do
            git config --local --unset-all "$k" || true
          done
          # sync FIRST: the persistent runner workspace keeps submodule URLs in
          # .git/modules/*/config and `submodule init` never overwrites them, so
          # a URL corrected in .gitmodules would otherwise stay broken forever
          # (bdh-org/dev-common#105).
          git submodule sync -- "${WANT[@]}" || true

          CFG=()
          minted=""

          mint() { # org -> append an insteadOf rewrite carrying a token for that org
            local org="$1" out tok
            out="$(mktemp "${RUNNER_TEMP:-/tmp}/hydrate-XXXXXX")"
            # The mint script masks its token by printing ::add-mask:: on STDOUT, so
            # stdout must reach the job log; the value itself only lands in $out, never
            # in a step output (a hydration token is nobody else's business).
            if ! GITHUB_OUTPUT="$out" CODER_TOKEN_ENV_NAME="" "$MINT" "$org"; then
              rm -f "$out"; return 1
            fi
            tok="$(sed -n 's/^coder_token=//p' "$out" | head -1)"
            rm -f "$out"
            [ -n "$tok" ] || return 1
            CFG+=(-c "url.https://x-access-token:${tok}@github.com/${org}/.insteadOf=https://github.com/${org}/")
          }

          for p in "${WANT[@]}"; do
            url="$(printf '%s\n' "$MAP" | awk -F'\t' -v p="$p" '$1 == p {print $2; exit}')"
            org="$(sm_org "$url")"
            [ -n "$org" ] || continue
            case " $minted " in *" $org "*) continue;; esac
            minted="$minted $org"
            # Tolerant: a repo whose VAULT_ADDR variable is unset cannot mint, and
            # the checkout credential still covers a same-repo submodule. The check
            # below is the only thing that decides this step.
            mint "$org" || echo "::warning::could not mint a ${org} token -- falling back to the checkout credential"
          done

          # --force is LOAD-BEARING (dev-common#176). Without it, `submodule update --init`
          # is a NO-OP whenever the module HEAD already equals the pin -- it never looks at
          # the working tree. On this persistent runner an earlier job can leave a submodule
          # directory emptied of tracked files while .git and HEAD survive, and every later
          # hydration then "succeeds" against an empty directory. --force checks the tree out
          # regardless. Verified: plain update does not restore the files, --force does.
          git ${CFG[@]+"${CFG[@]}"} submodule update --init --force -- "${WANT[@]}" || true

          # A submodule NESTED inside a path this job kept is the one case the deinit
          # above cannot see (bdh-org/dev-common#306). `git submodule status` is
          # non-recursive, so a nested path never enters the drop list, and `submodule
          # update --force -- <parent>` runs `checkout -f` in the parent, which does not
          # touch a gitlink directory's contents. So an agent job's `--recursive` init
          # leaves e.g. stack-common/common populated at whatever commit it was on,
          # plus any stray files, and a test guarded on "is this submodule checked
          # out?" runs against it -- finzeug/heller#356 one level down, reproduced on
          # git 2.43.0.
          #
          # Byte-identical in ci-build.yml; tests/ci-build.test.sh holds the two copies
          # together, the same way it does for sm_map/sm_org. It is NOT part of the
          # shared library above the HYDRATE_LIB_ONLY guard: the agent workflows init
          # --recursive on purpose and must never sweep.
          sm_sweep_unlisted() { # keep-list -> 0, or 1 having named every path left
            local keep="$1" rc=0 p root
            # Reverse sort is deepest-first: a descendant sorts after its ancestor, so a
            # nested path is cleared while the parent that declares it is still a repo.
            while IFS= read -r p; do
              case "$p" in ''|/*|*..*) continue;; esac
              if printf '%s\n' $keep | grep -qxF -- "$p"; then continue; fi
              [ -d "$p" ] || continue
              [ -n "$(ls -A "$p" 2>/dev/null || true)" ] || continue
              # `deinit` only works from the repo that DECLARES the path: run from the
              # superproject a nested path fails with "pathspec did not match any
              # file(s) known to git". And only when $p is a repo itself -- from a
              # non-repo path --show-superproject-working-tree walks up and names the
              # wrong repo, whose pathspec could match a path this job asked to keep.
              if [ -e "$p/.git" ]; then
                root="$(git -C "$p" rev-parse --show-superproject-working-tree 2>/dev/null || true)"
                if [ -n "$root" ]; then
                  git -C "$root" submodule deinit -f -- \
                    "$(realpath --relative-to="$root" "$p")" >/dev/null 2>&1 || true
                fi
              fi
              # Stray files an earlier job left beside the tracked ones are not the
              # gitlink's business, so clear whatever deinit did not.
              find "$p" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
              if [ -n "$(ls -A "$p" 2>/dev/null || true)" ]; then
                echo "::error::${p} is not in this job's submodule list and will not clear"
                rc=1
              else
                echo "deinitialised (recursive sweep), not in this job's list: $p"
              fi
            done < <(git submodule status --recursive 2>/dev/null | awk '{print $2}' | sort -r)
            return $rc
          }

          # AFTER the update, never before: a nested path only exists once its parent
          # is checked out, and which nested paths the parent declares is decided by
          # the commit hydration just put there.
          sm_sweep_unlisted "$keep" || {
            echo "::error::refusing to run CI with a submodule this repo did not ask for on disk"
            exit 1
          }

          # Fail LOUDLY, naming the submodule and the org it needed. A submodule this
          # workflow asked for and did not populate must never be handed on as an
          # empty directory for `make lint` to trip over 40 lines from the cause
          # (home-infra#343, home-infra#359). `submodule status` prefixes '-' for one
          # never initialised and '+' for one left at a commit other than the pin --
          # and '+' is how this bug hid, a stale checkout on the persistent runner
          # standing in for a fetch that never happened.
          # `submodule status` is NOT sufficient on its own, which is how this got past the
          # first version of this guard. It reports a path CLEAN when .git exists and HEAD
          # matches the pin, even with every tracked file deleted -- reproduced directly:
          # remove the files, keep .git, and status prints a leading space, not '-' or '+'.
          # So ask the WORKING TREE whether it holds anything, which is the question pip and
          # `make lint` are really asking two steps later.
          bad="$(git submodule status -- "${WANT[@]}" 2>/dev/null | grep -E '^[-+]' || true)"
          for _p in "${WANT[@]}"; do
            # Anything other than .git itself counts as populated.
            if [ -z "$(ls -A "$_p" 2>/dev/null | grep -vx '.git' || true)" ]; then
              bad="${bad}"$'\n'" ${_p}"
              echo "::error::${_p} is checked out at its pin but its working tree is EMPTY"
            fi
          done
          bad="$(printf '%s\n' "$bad" | sed '/^[[:space:]]*$/d')"
          if [ -n "$bad" ]; then
            echo "::error::submodule hydration incomplete -- refusing to run CI against a partial checkout"
            while read -r rev path _; do
              [ -n "${path:-}" ] || continue
              url="$(printf '%s\n' "$MAP" | awk -F'\t' -v p="$path" '$1 == p {print $2; exit}')"
              org="$(sm_org "$url")"
              case "$rev" in -*) why="never initialised";; *) why="not at the pinned commit";; esac
              echo "::error::  ${path}: ${why} -- url ${url:-unknown}, org ${org:-unknown}"
            done <<< "$bad"
            echo "If the org is right, check that the bdh-org-coder App is installed there" >&2
            echo "(Vault kv/ai/coder/github-app needs an install_<org> field for it)," >&2
            echo "and that this repo sets the VAULT_ADDR variable." >&2
            exit 1
          fi
          git submodule status -- "${WANT[@]}" | sed 's/^/  /'
          echo "submodule hydration OK"

      # Directly after hydration, which is the first point common/ exists -- and
      # deliberately BEFORE the conda env, which this needs none of: the checker is
      # `ast` and the stdlib, run by the runner's system python3 (the forge runner has
      # no pip and no venv module at all, measured 2026-08-16). So a page repo hears
      # "your dataflow graph is illegal" in seconds rather than after an env build.
      #
      # Skipped entirely when the input is empty, which is every caller that has no
      # marimo pages. Running the checker on "" would exit 2 -- "assessed nothing" --
      # and redden the whole fleet at once.
      #
      # The guard's own suite is tests/marimo-graph-check.test.sh in dev-common; this
      # step is the only thing that runs it anywhere else (dev-common#332).
      - name: marimo dataflow graph
        if: ${{ inputs.marimo-pages != '' }}
        env:
          MARIMO_PAGES: ${{ inputs.marimo-pages }}
        run: |
          set -euo pipefail
          # Nonzero is a failure: 1 means defects, 2 means it discovered no pages under
          # the path -- a moved pages directory must not read as a clean bill of health
          # (bdh-org/home-infra#232, #343). `set -e` fails the job on either.
          python3 common/scripts/marimo-graph-check.py "$MARIMO_PAGES"

      # Point CONDA_ROOT at the runner's REAL home rather than a hardcoded path:
      # github-runner's home isn't the assumed /home/github-runner on forge (it's
      # /srv/github-runner), and hardcoding forces a phantom dir. $HOME is the
      # runner user's home, so conda lives at <home>/miniforge3 -- portable across hosts.
      - name: Resolve CONDA_ROOT from the runner's home
        run: echo "CONDA_ROOT=$HOME/miniforge3" >> "$GITHUB_ENV"

      # The conda env persists on the runner's disk between runs -- that IS the
      # cache. Rebuild only when its inputs change, keyed on a hash stored in
      # the env dir. full-env hashes conda-packages.txt + the shared base list;
      # minimal mode hashes the ci-env-file.
      - name: Set up conda env (cached on disk)
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          envpath="$CONDA_ROOT/envs/$CI_ENV"
          # Bump CACHE_VERSION to force a rebuild of every CI env on disk.
          CACHE_VERSION=v5
          # The pinned ruff is part of the key below. Pinning a tool INSIDE a cached
          # env does nothing until the key changes: slingshot's format gate kept
          # failing on README.md after the pin landed, because the env was a cache
          # hit and the whole install block -- pin included -- was skipped
          # (bdh-org/dev-common#193, finzeug/slingshot#211).
          if [ "${{ inputs.full-env }}" = "true" ]; then
            key=$( { echo "$CACHE_VERSION"; cat common/RUFF_VERSION conda-packages.txt requirements-prod.txt common/devcontainer/base-conda-packages.txt 2>/dev/null; } | sha256sum | cut -d' ' -f1)
          else
            key=$( { echo "$CACHE_VERSION"; cat common/RUFF_VERSION 2>/dev/null; cat "${{ inputs.ci-env-file }}"; } | sha256sum | cut -d' ' -f1)
          fi
          have=$(cat "$envpath/.envhash" 2>/dev/null || true)

          # A long-lived self-hosted runner accumulates a conda package cache, and
          # that cache CORRUPTS. finzeug/slingshot#218 died here on:
          #
          #   CondaError: Cannot link a source that does not exist.
          #     /srv/github-runner/miniforge3/envs/slingshot-ci/.condatmp/ff76c0d8-...
          #   Running `conda clean --packages` may resolve your problem.
          #
          # It is STICKY and it is invisible until someone changes a dependency: the
          # env only rebuilds when the key moves, so every other PR sails through on a
          # cache hit while the one PR that touches conda-packages.txt looks like it
          # broke CI. It also leaves a half-built env and never writes .envhash, so the
          # next attempt repeats it forever.
          #
          # So the build is attempted, and on failure the cache is cleaned and it is
          # tried ONCE more. Once, deliberately: a second failure is a real dependency
          # problem and must surface as one rather than be retried into a timeout.
          build_env() {
            if [ "${{ inputs.full-env }}" = "true" ]; then
              # Build the named env directly with `-n` (base conda binary, no
              # activation). We do NOT call `make env`: it's written for the
              # devcontainer where everything installs into base, and its
              # CONDA_PREFIX usage fights a per-repo named env. This mirrors
              # make env's inputs: shared base list + the repo's conda-packages
              # + the CI-relevant dev tools.
              echo "Building/updating full env $CI_ENV"
              conda create -y -n "$CI_ENV" || true
              conda install -y -n "$CI_ENV" --file common/devcontainer/base-conda-packages.txt
              if [ -f conda-packages.txt ]; then
                conda install -y -n "$CI_ENV" --file conda-packages.txt
              fi
              # Ruff PINNED, third and last place it was not (bdh-org/dev-common#193).
              # A conda env built on a different day gets a different ruff, and
              # `ruff format` changes output between patch releases -- so slingshot's
              # gate passed locally on 0.16.3 and failed here on ONE file: README.md,
              # whose embedded python block one version reflows and another does not
              # (finzeug/slingshot#211). Indistinguishable from real code being wrong.
              RUFF_V="$( [ -r common/RUFF_VERSION ] && tr -d '[:space:]' < common/RUFF_VERSION || echo "0.16.3" )"
              echo "pinned ruff ${RUFF_V}"
              # ruff via PIP, not conda: conda-forge lags PyPI, and pinning conda to a
              # version it does not carry yet fails env creation outright with
              # PackagesNotFoundInChannelsError. pip is also what the hosted workflow and
              # the devcontainer resolve from, so all three get the same binary.
              conda install -y -n "$CI_ENV" pytest pytest-cov
              conda run -n "$CI_ENV" pip install --quiet "ruff==${RUFF_V}"
              # Also pip-install prod requirements: conda-packages.txt is the dev
              # convenience list and can miss pip-only deps (e.g. fred-py-api,
              # not on conda-forge). requirements-prod.txt is the authoritative
              # runtime set and its pins match the conda versions, so this is
              # mostly a no-op except for the genuinely pip-only packages.
              if [ -f requirements-prod.txt ]; then
                conda run -n "$CI_ENV" pip install -r requirements-prod.txt
              fi
            else
              echo "Building/updating minimal env $CI_ENV from ${{ inputs.ci-env-file }}"
              conda env update -n "$CI_ENV" -f "${{ inputs.ci-env-file }}" --prune
            fi
          }

          if [ ! -d "$envpath" ] || [ "$key" != "$have" ]; then
            if ! build_env; then
              echo "::warning::conda env build failed -- cleaning the package cache and retrying once (bdh-org/dev-common: slingshot#218)"
              conda clean -y --packages --tarballs || true
              # The half-built env is part of the wreckage: linking failed partway, so
              # what is on disk is neither the old env nor the new one.
              conda env remove -y -n "$CI_ENV" || true
              build_env
            fi
            echo "$key" > "$envpath/.envhash"
          else
            echo "conda env $CI_ENV up to date (cache hit: $key)"
          fi

      # Vendored siblings install from lib/ rather than PyPI, so requirements-prod
      # deliberately omits them -- which meant every code path behind them was
      # invisible to CI, degrading to a warning rather than a failure
      # (finzeug/panoptikon#648).
      - name: Install the extra submodules into the env
        if: inputs.extra-submodules != ''
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate "$CI_ENV"
          pip install ${{ inputs.extra-submodules }}

      # `make init` is step 3 of creating a repo from devtemplate, and NOTHING
      # notices when it is skipped. GitHub's "Create from template" produces a
      # repo that builds, tests, merges and deploys perfectly normally while
      # still carrying the TEMPLATE's identity, so the omission never surfaces
      # as itself.
      #
      # bdh-org/travel ran that way from creation: PROJECT_NAME=devtemplate and
      # VERSION=0.8.13, devtemplate's own number rather than a new lineage. Its
      # first PR hit the "Version bumped" gate below, `make bump-patch` did as it
      # was told, and the repo is now tagged 0.8.14 -- two commits old, claiming
      # fourteen patch releases, one ahead of the template it was copied from
      # (bdh-org/dev-common#242, bdh-org/travel#3).
      #
      # THIS RUNS BEFORE THE VERSION STEPS DELIBERATELY. The version gate fired
      # first and reported a missing bump. That was true and useless: the repo
      # did not need a bump, it needed initialising. A root cause that reports as
      # a symptom sends you off fixing the symptom, which is how the meaningless
      # tag got written.
      #
      # PROJECT_NAME is the signal, not VERSION. The template's version moves, so
      # "equals devtemplate's current version" is not a stable test; the name is
      # rewritten by `make init` and by nothing else.
      #
      # NOT confined to pull_request, unlike the version gate. This is a property
      # of the repository rather than of a diff, so a push to main must fail too
      # -- otherwise the commit that most needs to be identifiable is the one
      # that escapes the check.
      - name: Template initialised
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY:-}"
          if [ -z "$repo" ]; then
            echo "::error::GITHUB_REPOSITORY is unset -- cannot tell whether this is"
            echo "::error::devtemplate itself, and guessing would either false-fail the"
            echo "::error::template or wave through an uninitialised clone."
            exit 1
          fi
          if [ "${repo##*/}" = "devtemplate" ]; then
            echo "this is devtemplate itself -- nothing to check"
            exit 0
          fi
          if [ ! -f Makefile ]; then
            echo "no Makefile -- nothing to check"
            exit 0
          fi
          stale=""
          for var in PROJECT_NAME CONTAINER_NAME; do
            val=$(grep -m1 -E "^${var}[[:space:]]*=" Makefile 2>/dev/null | sed -E "s/^${var}[[:space:]]*=[[:space:]]*//" | tr -d ' \r' || true)
            if [ "$val" = "devtemplate" ]; then
              stale="$stale $var"
            fi
          done
          if [ -z "$stale" ]; then
            echo "template initialised -- PROJECT_NAME is not 'devtemplate'"
            exit 0
          fi
          echo "::error::This repo still carries the TEMPLATE's identity:$stale = devtemplate."
          echo "::error::'make init' was never run, so VERSION is devtemplate's too and this"
          echo "::error::repo's tags continue the template's lineage instead of starting its own."
          echo "::error::"
          echo "::error::Fresh repo, nothing worth keeping yet:"
          echo "::error::    make init        # renames, resets VERSION to 0.0.1, commits"
          echo "::error::"
          echo "::error::Already has commits or tags? Do NOT run 'make init' -- it resets"
          echo "::error::VERSION to 0.0.1, which moves BACKWARDS past a tag you already have."
          echo "::error::Set PROJECT_NAME and CONTAINER_NAME in the Makefile by hand and decide"
          echo "::error::the version separately (bdh-org/travel#3)."
          exit 1

      - name: Version consistency
        run: make version-check

      # TWO GATES, ONE STEP, and the same guard as the hosted workflow
      # (bdh-org/dev-common#124, #235, #338). It has to be in BOTH: the incident
      # that motivated it -- finzeug/panoptikon#569 merging on a version #567 had
      # already tagged -- happened in a repo that uses THIS workflow, so putting
      # the guard only in ci.yml would have missed its own motivating case.
      #
      #   "Version bumped"     -- compares this branch against its BASE. Catches a
      #                           PR that changed code and forgot to bump, a
      #                           version that went BACKWARDS, and a number the
      #                           base has already reached (a COLLISION, which
      #                           needs the opposite remedy from a missing bump).
      #   "Version claimed by
      #    another open PR"    -- compares against the repo's currently OPEN PRs.
      #                           The case no branch can see from its own
      #                           contents: two branches cut from one main each
      #                           bump to the same number, git merges the
      #                           identical VERSION line as AGREEMENT rather than
      #                           as a conflict, and both land.
      #
      # version-check above tests INTERNAL consistency (Makefile VERSION against
      # __init__.py / package.json) and has no notion of a base branch or of
      # another PR, so it passes on a PR that changed code and forgot to bump.
      #
      # ONE IMPLEMENTATION, shared with ci.yml and version-guard.yml. Both gates
      # were inline in all three files and drifted twice under a comment saying
      # they must not -- #182 left THIS file on the weaker comparison for ten days
      # while every repo in the stack called it, and #208's collision message
      # landed here and not in ci.yml (#232).
      #
      # STILL A STEP IN THIS JOB: `ci / ci` is the required context in nine
      # consumer repos. See the action's header for why, for how it gets its
      # token, and for what would reverse either.
      #
      # `pull-requests: read` is declared in this workflow's own `permissions:`
      # block, which the open-PR gate needs: a workflow-level block REPLACES the
      # caller's grant rather than adding to it, so leaving the scope out would
      # leave that gate permanently warning that it could not list open PRs.
      - name: Version guard
        if: github.event_name == 'pull_request'
        uses: bdh-org/dev-common/.github/actions/version-guard@main

      - name: Lint
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate "$CI_ENV"
          make lint

      - name: Test
        if: ${{ inputs.run-tests }}
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: |
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate "$CI_ENV"
          # `test-env`, one KEY=VALUE per line. Echoed by NAME so the log says
          # which variables the run had -- a suite that skips on a missing one
          # otherwise reports the same green as a suite that ran it.
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue;; esac
            export "$line"
            echo "test env: ${line%%=*}"
          done <<< "${TEST_ENV:-}"
          python -m pytest -vv "${{ inputs.test-path }}"
