name: CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      requirements-file:
        type: string
        default: "requirements-prod.txt"
      test-path:
        type: string
        default: "tests/"
      run-tests:
        type: boolean
        default: true
      run-lint:
        type: boolean
        default: true
      install-requirements:
        type: boolean
        default: true
      check-format:
        description: >
          Fail if `ruff format` would change anything. Opt-in per repo, default
          false, because every repo has its own formatting debt to pay first and a
          central default would turn the whole fleet red at once
          (bdh-org/home-infra#314).

          This exists because the Makefile opt-in (`lint: format-check`) does NOT
          reach this workflow. self-hosted-ci.yml runs `make lint`, so a Makefile
          rule is enough there; THIS workflow runs `ruff check .` directly, because
          python.mk's lint calls $(CONDA_PREFIX)/bin/ruff and there is no conda on a
          hosted runner. A repo that added the Makefile rule and used this workflow
          therefore had a format gate that ran locally and never in CI -- which
          looks identical to having one.
        type: boolean
        default: false

# Same rule as self-hosted-ci.yml, for the same reason. GitHub-hosted minutes are
# metered rather than serialized, so the cost here is the bill instead of the
# queue -- but a superseded run is waste either way, and keeping both reusables
# identical means a repo's behaviour does not change when it moves between them.
# See self-hosted-ci.yml for why `github.repository` is in the key and why
# cancellation is confined to pull_request.
concurrency:
  group: hosted-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # The version-bump guard below diffs against the base branch, which
          # needs more than the default shallow clone.
          fetch-depth: 0

      - name: Clone dev-common submodule
        run: git submodule update --init common

      # `make init` is step 3 of creating a repo from devtemplate, and NOTHING
      # notices when it is skipped. GitHub's "Create from template" produces a
      # repo that builds, tests, merges and deploys perfectly normally while
      # still carrying the TEMPLATE's identity, so the omission never surfaces
      # as itself.
      #
      # bdh-org/travel ran that way from creation: PROJECT_NAME=devtemplate and
      # VERSION=0.8.13, devtemplate's own number rather than a new lineage. Its
      # first PR hit the "Version bumped" gate below, `make bump-patch` did as it
      # was told, and the repo is now tagged 0.8.14 -- two commits old, claiming
      # fourteen patch releases, one ahead of the template it was copied from
      # (bdh-org/dev-common#242, bdh-org/travel#3).
      #
      # THIS RUNS BEFORE THE VERSION STEPS DELIBERATELY. The version gate fired
      # first and reported a missing bump. That was true and useless: the repo
      # did not need a bump, it needed initialising. A root cause that reports as
      # a symptom sends you off fixing the symptom, which is how the meaningless
      # tag got written.
      #
      # PROJECT_NAME is the signal, not VERSION. The template's version moves, so
      # "equals devtemplate's current version" is not a stable test; the name is
      # rewritten by `make init` and by nothing else.
      #
      # NOT confined to pull_request, unlike the version gate. This is a property
      # of the repository rather than of a diff, so a push to main must fail too
      # -- otherwise the commit that most needs to be identifiable is the one
      # that escapes the check.
      - name: Template initialised
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY:-}"
          if [ -z "$repo" ]; then
            echo "::error::GITHUB_REPOSITORY is unset -- cannot tell whether this is"
            echo "::error::devtemplate itself, and guessing would either false-fail the"
            echo "::error::template or wave through an uninitialised clone."
            exit 1
          fi
          if [ "${repo##*/}" = "devtemplate" ]; then
            echo "this is devtemplate itself -- nothing to check"
            exit 0
          fi
          if [ ! -f Makefile ]; then
            echo "no Makefile -- nothing to check"
            exit 0
          fi
          stale=""
          for var in PROJECT_NAME CONTAINER_NAME; do
            val=$(grep -m1 -E "^${var}[[:space:]]*=" Makefile 2>/dev/null | sed -E "s/^${var}[[:space:]]*=[[:space:]]*//" | tr -d ' \r' || true)
            if [ "$val" = "devtemplate" ]; then
              stale="$stale $var"
            fi
          done
          if [ -z "$stale" ]; then
            echo "template initialised -- PROJECT_NAME is not 'devtemplate'"
            exit 0
          fi
          echo "::error::This repo still carries the TEMPLATE's identity:$stale = devtemplate."
          echo "::error::'make init' was never run, so VERSION is devtemplate's too and this"
          echo "::error::repo's tags continue the template's lineage instead of starting its own."
          echo "::error::"
          echo "::error::Fresh repo, nothing worth keeping yet:"
          echo "::error::    make init        # renames, resets VERSION to 0.0.1, commits"
          echo "::error::"
          echo "::error::Already has commits or tags? Do NOT run 'make init' -- it resets"
          echo "::error::VERSION to 0.0.1, which moves BACKWARDS past a tag you already have."
          echo "::error::Set PROJECT_NAME and CONTAINER_NAME in the Makefile by hand and decide"
          echo "::error::the version separately (bdh-org/travel#3)."
          exit 1

      - name: Version consistency
        run: make version-check

      # A merge to main must be identifiable by version (bdh-org/dev-common#124).
      #
      # `version-check` above tests INTERNAL consistency -- Makefile VERSION
      # against __init__.py / package.json / VERSION_TXT. It has no notion of a
      # base branch, so it passes happily on a PR that changed code and forgot
      # to bump. finzeug/panoptikon#569 merged that way: VERSION stayed on a
      # number #567 had already tagged, tag-version.yml (which triggers only on
      # Makefile changes) never fired, and the deployed image reported someone
      # else's version.
      #
      # Skips repos with no VERSION line, so this cannot break a repo that does
      # not version this way. Allows a pure bump PR, which is the fix rather
      # than a violation.
      - name: Version bumped
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          if ! grep -qE '^VERSION[[:space:]]*=' Makefile 2>/dev/null; then
            echo "no VERSION in Makefile -- this repo does not version here, skipping"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          head_v=$(grep -m1 -E '^VERSION[[:space:]]*=' Makefile | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//')
          base_v=$(git show "$base:Makefile" 2>/dev/null | grep -m1 -E '^VERSION[[:space:]]*=' | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' || echo "")
          if [ -z "$base_v" ]; then
            echo "no VERSION on $base -- nothing to compare, skipping"
            exit 0
          fi
          if [ "$head_v" != "$base_v" ]; then
            # STRICTLY GREATER, not merely different (dev-common#180/#182).
            #
            # "Different" passes every branch in a parallel set: three panoptikon
            # PRs each branched from 2.12.105 and each bumped to 2.12.106, so each
            # differed from its base and each went green. The first merged and
            # tagged 2.12.106; the other two rode onto main under a version whose
            # tag pointed two commits behind them (finzeug/panoptikon#728/#729/#730).
            #
            # What `!=` alone lets through is a version that DECREASES -- which
            # cannot be tagged, and whose image tag collides with a build that has
            # already shipped.
            if [ "$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)" = "$head_v" ]; then
              echo "version bumped: $base_v -> $head_v"
              exit 0
            fi
            echo "::error::VERSION went BACKWARDS: $base_v on ${{ github.base_ref }}, $head_v here."
            echo "::error::Rebase and run 'make bump-patch' -- a version that decreases"
            echo "::error::cannot be tagged, and the image tag would collide with a build"
            echo "::error::that already shipped."
            exit 1
          fi
          changed=$(git diff --name-only "$base"...HEAD | grep -v '^Makefile$' || true)
          if [ -z "$changed" ]; then
            echo "nothing changed but the Makefile -- nothing to version"
            exit 0
          fi
          # COLLISION, not a missing bump -- and they need opposite remedies, so
          # they must not share a message. If this branch DID bump relative to the
          # point it forked from, and the base has since reached that same version,
          # then another PR merged the same number first. The author already ran
          # `make bump-patch`; telling them to run it again is the one instruction
          # that looks wrong and is right, so it has to say WHY.
          #
          # Two open PRs in one repo hit this by construction: each carries a bump
          # computed when it was opened, and whichever merges first takes the number.
          # A submodule-bump sweep that opens three PRs in a repo hits it twice.
          # (bdh-org/dev-common#208, found merging seven bump PRs on 2026-08-16.)
          #
          # NOT fixed by comparing against the merge base instead: that would pass a
          # stale bump and let two changes land on ONE version, which is the exact
          # thing this check exists to prevent -- the deployed image would report a
          # version belonging to another change.
          mb="$(git merge-base "$base" HEAD 2>/dev/null || true)"
          if [ -n "$mb" ]; then
            mb_v=$(git show "$mb:Makefile" 2>/dev/null | grep -m1 -E '^VERSION[[:space:]]*=' | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' || echo "")
            if [ -n "$mb_v" ] && [ "$head_v" != "$mb_v" ]; then
              echo "::error::VERSION COLLISION -- this PR bumped $mb_v -> $head_v, but ${{ github.base_ref }} has ALSO reached $head_v."
              echo "::error::Another PR merged that same version first. Your bump was fine; it is now taken."
              echo "::error::Re-bump on top of the updated base:"
              echo "::error::    git fetch origin ${{ github.base_ref }} && git merge origin/${{ github.base_ref }}"
              echo "::error::    make bump-patch && git push"
              echo "::error::Do NOT edit the version by hand, and do NOT re-run this job -- the"
              echo "::error::number is taken until the branch moves."
              exit 1
            fi
          fi
          echo "::error::VERSION is still $base_v but this PR changes:"
          echo "$changed" | sed 's/^/  /'
          echo "::error::Run 'make bump-patch' -- never edit the version by hand."
          echo "::error::Without a bump, tag-version.yml does not fire and the"
          echo "::error::deployed image reports a version belonging to another change."
          exit 1

      # The half of the collision that the step above CANNOT see.
      #
      # "Version bumped" compares this branch against its BASE, so it notices a
      # collision only once the other PR has MERGED -- by which time both
      # branches claimed the number and one of them is being repaired by hand.
      # While the two PRs are merely OPEN, each one's base is untouched and each
      # one is individually, verifiably correct. There is nothing for a reviewer
      # to see on either diff.
      #
      # Nor will git object. Two branches cut from the same main each run
      # `make bump-patch`, each writes the IDENTICAL VERSION line, and git merges
      # an identical edit as AGREEMENT rather than as a conflict. Both land, one
      # of the two versions silently never exists, and because tag-version.yml
      # triggers on `paths: ['Makefile']`, a bump whose Makefile ends up
      # byte-identical gets no tag either -- silent at both ends
      # (bdh-org/home-infra#617).
      #
      # Three in one afternoon, 2026-09-20, all in finzeug/heller, all repaired
      # by hand: #558 carried 1.3.268 against a main at 1.3.267; #559 was a
      # submodule bump carrying no version change at all; #563 carried 1.3.268
      # against a main already at 1.3.269. It scales with how many branches are
      # open at once, which is rising as the headless agent is used more
      # (bdh-org/dev-common#255, bdh-org/home-infra#674 and #675).
      #
      # curl AND jq, NOT `gh`. The specifying issue said "a few lines against
      # `gh pr list`". There is no `gh` on the forge self-hosted runner, and
      # self-hosted-ci.yml is what most of this fleet actually calls -- so a `gh`
      # implementation would be green on ubuntu-latest and command-not-found
      # everywhere that matters. curl and jq are present on both.
      #
      # THE LOWEST PR NUMBER WINS, and only the later PR goes red. Failing both
      # deadlocks a pair that is each other's only problem, and blocks the PR
      # that did nothing wrong. The tiebreak needs no stored state and reads the
      # same way from either side.
      #
      # A TOKEN THAT CANNOT LIST PRs WARNS RATHER THAN FAILS. This reusable is
      # consumed at @main by the whole fleet, so a hard failure here would turn
      # every caller red at once over a permission none of them had been asked
      # for. The warning names the exact remedy instead. It is still never a
      # SILENT pass: every path prints what it concluded.
      - name: Version claimed by another open PR
        if: github.event_name == 'pull_request'
        env:
          # Via env, never interpolated into the command line. A token in argv
          # is visible in process listings and in the log's own command echo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          if ! grep -qE '^VERSION[[:space:]]*=' Makefile 2>/dev/null; then
            echo "no VERSION in Makefile -- this repo does not version here, skipping"
            exit 0
          fi
          head_v=$(grep -m1 -E '^VERSION[[:space:]]*=' Makefile \
            | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' | tr -d ' \r')
          if [ -z "$head_v" ]; then
            echo "VERSION line is empty -- nothing to compare, skipping"
            exit 0
          fi

          pr="${{ github.event.pull_request.number }}"
          base="${{ github.base_ref }}"
          repo="${GITHUB_REPOSITORY:-}"
          api="${GITHUB_API_URL:-https://api.github.com}"

          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::warning::No GITHUB_TOKEN, so this repo's other open PRs cannot be"
            echo "::warning::listed and a version one of them already claims will NOT be"
            echo "::warning::detected. Add to the job that calls this workflow:"
            echo "::warning::    permissions:"
            echo "::warning::      pull-requests: read"
            exit 0
          fi
          case "$pr" in
            ''|*[!0-9]*)
              echo "::warning::PR number '$pr' is not numeric -- skipping the open-PR check."
              exit 0 ;;
          esac
          if [ -z "$repo" ] || [ -z "$base" ]; then
            echo "::warning::No repository/base context -- skipping the open-PR check."
            exit 0
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # `base=` narrows to PRs targeting the same branch: a PR aimed at some
          # other base is not competing for this lineage's next number.
          if ! status=$(curl -sS -o "$tmp/prs.json" -w '%{http_code}' \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/repos/$repo/pulls?state=open&base=$base&per_page=100" \
                2>"$tmp/err"); then
            status="000"
          fi
          if [ "$status" != "200" ]; then
            # The SERVER's own words, never a parser's. A 403 reading "Resource
            # not accessible by integration" ends this in one step; a jq error
            # about a missing key sends the reader somewhere else entirely.
            echo "::warning::Could not list open PRs (HTTP $status). The server said:"
            head -c 400 "$tmp/err" 2>/dev/null | sed 's/^/  /' || true
            head -c 400 "$tmp/prs.json" 2>/dev/null | sed 's/^/  /' || true
            echo ""
            echo "::warning::Most likely the calling job lacks 'pull-requests: read'."
            echo "::warning::A version already claimed by an open PR was NOT checked."
            exit 0
          fi

          if ! others=$(jq -r --argjson me "$pr" '
                .[] | select(.number != $me)
                    | [ (.number|tostring), .head.sha,
                        (.draft|tostring), .title ] | @tsv
                ' "$tmp/prs.json" 2>"$tmp/jqerr"); then
            echo "::warning::Could not parse the open-PR list:"
            sed 's/^/  /' "$tmp/jqerr" 2>/dev/null || true
            echo "::warning::A version already claimed by an open PR was NOT checked."
            exit 0
          fi
          if [ -z "$others" ]; then
            echo "no other open PR against $base -- $head_v is uncontested"
            exit 0
          fi

          # A DRAFT still counts. It holds the number and can be marked ready at
          # any moment, so excluding drafts would reintroduce the silent
          # collision this step exists to remove. It is labelled, so the author
          # can judge whether to chase it.
          earliest=""
          lower=""
          higher=""
          while IFS="$(printf '\t')" read -r n sha draft title; do
            [ -n "${n:-}" ] || continue
            if ! st=$(curl -sS -o "$tmp/mk" -w '%{http_code}' \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.raw" \
                  "$api/repos/$repo/contents/Makefile?ref=$sha" \
                  2>/dev/null); then
              st="000"
            fi
            if [ "$st" != "200" ]; then
              echo "  PR #$n: no readable Makefile at $sha (HTTP $st) -- not compared"
              continue
            fi
            v=$(grep -m1 -E '^VERSION[[:space:]]*=' "$tmp/mk" 2>/dev/null \
              | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*//' | tr -d ' \r' || true)
            if [ -z "$v" ]; then
              echo "  PR #$n: no VERSION line -- not compared"
              continue
            fi
            if [ "$v" != "$head_v" ]; then
              echo "  PR #$n: $v -- no collision"
              continue
            fi
            label="#$n"
            if [ "$draft" = "true" ]; then
              label="$label (draft)"
            fi
            title=$(printf '%.60s' "$title")
            if [ "$n" -lt "$pr" ]; then
              lower="${lower}PR ${label} already claims ${head_v}: ${title}"$'\n'
              if [ -z "$earliest" ] || [ "$n" -lt "$earliest" ]; then
                earliest="$n"
              fi
            else
              higher="${higher}PR ${label} also carries ${head_v}: ${title}"$'\n'
            fi
          done <<< "$others"

          if [ -n "$lower" ]; then
            echo "::error::VERSION COLLISION WITH AN OPEN PR -- this PR carries $head_v, and so does:"
            printf '%s' "$lower" | sed 's/^/::error::  /'
            echo "::error::"
            echo "::error::Both branches were cut from the same $base and each ran"
            echo "::error::'make bump-patch', so each computed the SAME next number. git"
            echo "::error::merges two identical VERSION lines as AGREEMENT rather than as a"
            echo "::error::conflict, so nothing would stop both landing -- and one of the two"
            echo "::error::versions would silently never exist."
            echo "::error::"
            echo "::error::PR #$earliest opened first, so it keeps $head_v and THIS PR re-bumps:"
            echo "::error::    git fetch origin $base && git merge origin/$base"
            echo "::error::    make bump-patch && git push"
            echo "::error::"
            echo "::error::Do NOT edit the version by hand, and do NOT simply re-run this job"
            echo "::error::-- the number stays taken until this branch moves."
            exit 1
          fi

          if [ -n "$higher" ]; then
            # Reported, not failed: this PR opened first, so it keeps the number
            # and the other one re-bumps. That PR's own run is where it is red.
            echo "::warning::Another open PR carries $head_v as well:"
            printf '%s' "$higher" | sed 's/^/::warning::  /'
            echo "::warning::This PR opened first, so it keeps $head_v and the other re-bumps."
            echo "::warning::Nothing to do here."
          fi

          echo "no earlier open PR claims $head_v"

      # Registry-image deploys deliver DAGs ONLY when the image bakes them: the
      # merge-to-main pipeline ships the image, and Airflow tasks docker-run into
      # it — a dags/ dir the Dockerfile never COPYs means merged DAG changes
      # silently never land (bdh-org/home-infra#15; bit panoptikon/hog/freddyb).
      - name: DAG delivery guardrail
        run: |
          if [ -d dags ] && [ -f Dockerfile ] && ! grep -Eq '^[[:space:]]*COPY[[:space:]]+.*dags' Dockerfile; then
            echo "::error::dags/ exists but the Dockerfile never COPYs it — DAG changes will not be delivered by the registry image. Add 'COPY dags/ /app/dags/' (bdh-org/home-infra#15)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install project requirements
        if: inputs.install-requirements
        run: pip install -r ${{ inputs.requirements-file }}

      # Ruff is PINNED, and for the formatter that is not optional. `ruff format`
      # changes its output between patch releases, so an unpinned CI installs
      # whatever shipped that morning and a format gate can go red on a day nobody
      # touched any code. It also guarantees CI and a devcontainer disagree.
      #
      # The version comes from common/RUFF_VERSION when the caller's pin is new
      # enough to have it, and otherwise from RUFF_FALLBACK here.
      #
      # The fallback is NOT laziness -- it is the fix for a real ordering bug. This
      # reusable is consumed at @main, but common/ is whatever revision the CALLER
      # pins, which always lags. Requiring the file made every repo's CI fail the
      # moment this step shipped, because no caller's pin had it yet
      # (finzeug/ferret#41). Both paths are pinned, so neither is the condition this
      # exists to remove; the file simply wins once pins catch up, and the two
      # converge without a flag day.
      - name: Install dev tools
        env:
          RUFF_FALLBACK: "0.16.3"
        run: |
          set -eu
          if [ -r common/RUFF_VERSION ]; then
            RUFF_V="$(tr -d '[:space:]' < common/RUFF_VERSION)"
            echo "pinned ruff ${RUFF_V} (from common/RUFF_VERSION)"
          else
            RUFF_V="${RUFF_FALLBACK}"
            echo "pinned ruff ${RUFF_V} (fallback -- this repo's common/ pin predates RUFF_VERSION)"
          fi
          [ -n "$RUFF_V" ] || { echo "::error::no ruff version resolved -- refusing to install an unpinned formatter"; exit 1; }
          pip install "ruff==${RUFF_V}" pytest pytest-cov

      - name: Lint
        if: inputs.run-lint
        run: ruff check .

      # Excludes the VENDORED trees. `ruff format --check .` from the repo root
      # walks the hydrated submodules too, so ferret's first gated run failed on
      # two files belonging to dev-common -- a repo cannot be gated on its
      # dependency's formatting, and the error names files the author of the PR
      # does not own and cannot fix from there (finzeug/ferret#41).
      #
      # Named explicitly rather than added to each repo's ruff.toml: the set is a
      # property of how this fleet vendors (common, stack-common, lib/*), not of
      # any one repo's style, so it belongs with the workflow that walks them.
      - name: Format check
        if: inputs.check-format
        run: ruff format --check --exclude common --exclude stack-common --exclude lib .

      - name: Test
        if: inputs.run-tests
        run: python -m pytest -vv ${{ inputs.test-path }}
