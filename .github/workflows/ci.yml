name: CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      requirements-file:
        type: string
        default: "requirements-prod.txt"
      test-path:
        type: string
        default: "tests/"
      run-tests:
        type: boolean
        default: true
      run-lint:
        type: boolean
        default: true
      install-requirements:
        type: boolean
        default: true
      check-format:
        description: >
          Fail if `ruff format` would change anything. Opt-in per repo, default
          false, because every repo has its own formatting debt to pay first and a
          central default would turn the whole fleet red at once
          (bdh-org/home-infra#314).

          This exists because the Makefile opt-in (`lint: format-check`) does NOT
          reach this workflow. self-hosted-ci.yml runs `make lint`, so a Makefile
          rule is enough there; THIS workflow runs `ruff check .` directly, because
          python.mk's lint calls $(CONDA_PREFIX)/bin/ruff and there is no conda on a
          hosted runner. A repo that added the Makefile rule and used this workflow
          therefore had a format gate that ran locally and never in CI -- which
          looks identical to having one.
        type: boolean
        default: false

# Same rule as self-hosted-ci.yml, for the same reason. GitHub-hosted minutes are
# metered rather than serialized, so the cost here is the bill instead of the
# queue -- but a superseded run is waste either way, and keeping both reusables
# identical means a repo's behaviour does not change when it moves between them.
# See self-hosted-ci.yml for why `github.repository` is in the key and why
# cancellation is confined to pull_request.
concurrency:
  group: hosted-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # The version-bump guard below diffs against the base branch, which
          # needs more than the default shallow clone.
          fetch-depth: 0

      - name: Clone dev-common submodule
        run: git submodule update --init common

      # `make init` is step 3 of creating a repo from devtemplate, and NOTHING
      # notices when it is skipped. GitHub's "Create from template" produces a
      # repo that builds, tests, merges and deploys perfectly normally while
      # still carrying the TEMPLATE's identity, so the omission never surfaces
      # as itself.
      #
      # bdh-org/travel ran that way from creation: PROJECT_NAME=devtemplate and
      # VERSION=0.8.13, devtemplate's own number rather than a new lineage. Its
      # first PR hit the "Version bumped" gate below, `make bump-patch` did as it
      # was told, and the repo is now tagged 0.8.14 -- two commits old, claiming
      # fourteen patch releases, one ahead of the template it was copied from
      # (bdh-org/dev-common#242, bdh-org/travel#3).
      #
      # THIS RUNS BEFORE THE VERSION STEPS DELIBERATELY. The version gate fired
      # first and reported a missing bump. That was true and useless: the repo
      # did not need a bump, it needed initialising. A root cause that reports as
      # a symptom sends you off fixing the symptom, which is how the meaningless
      # tag got written.
      #
      # PROJECT_NAME is the signal, not VERSION. The template's version moves, so
      # "equals devtemplate's current version" is not a stable test; the name is
      # rewritten by `make init` and by nothing else.
      #
      # NOT confined to pull_request, unlike the version gate. This is a property
      # of the repository rather than of a diff, so a push to main must fail too
      # -- otherwise the commit that most needs to be identifiable is the one
      # that escapes the check.
      - name: Template initialised
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY:-}"
          if [ -z "$repo" ]; then
            echo "::error::GITHUB_REPOSITORY is unset -- cannot tell whether this is"
            echo "::error::devtemplate itself, and guessing would either false-fail the"
            echo "::error::template or wave through an uninitialised clone."
            exit 1
          fi
          if [ "${repo##*/}" = "devtemplate" ]; then
            echo "this is devtemplate itself -- nothing to check"
            exit 0
          fi
          if [ ! -f Makefile ]; then
            echo "no Makefile -- nothing to check"
            exit 0
          fi
          stale=""
          for var in PROJECT_NAME CONTAINER_NAME; do
            val=$(grep -m1 -E "^${var}[[:space:]]*=" Makefile 2>/dev/null | sed -E "s/^${var}[[:space:]]*=[[:space:]]*//" | tr -d ' \r' || true)
            if [ "$val" = "devtemplate" ]; then
              stale="$stale $var"
            fi
          done
          if [ -z "$stale" ]; then
            echo "template initialised -- PROJECT_NAME is not 'devtemplate'"
            exit 0
          fi
          echo "::error::This repo still carries the TEMPLATE's identity:$stale = devtemplate."
          echo "::error::'make init' was never run, so VERSION is devtemplate's too and this"
          echo "::error::repo's tags continue the template's lineage instead of starting its own."
          echo "::error::"
          echo "::error::Fresh repo, nothing worth keeping yet:"
          echo "::error::    make init        # renames, resets VERSION to 0.0.1, commits"
          echo "::error::"
          echo "::error::Already has commits or tags? Do NOT run 'make init' -- it resets"
          echo "::error::VERSION to 0.0.1, which moves BACKWARDS past a tag you already have."
          echo "::error::Set PROJECT_NAME and CONTAINER_NAME in the Makefile by hand and decide"
          echo "::error::the version separately (bdh-org/travel#3)."
          exit 1

      - name: Version consistency
        run: make version-check

      # TWO GATES, ONE STEP (bdh-org/dev-common#235, #338). Both ask whether this
      # PR's VERSION is its own to take, and they differ only in who else might
      # have taken it:
      #
      #   "Version bumped"     -- compares this branch against its BASE. Catches a
      #                           PR that changed code and forgot to bump, a
      #                           version that went BACKWARDS, and a number the
      #                           base has already reached (a COLLISION, which
      #                           needs the opposite remedy from a missing bump).
      #   (A second gate, "Version claimed by another open PR", was removed by
      #   dev-common#344: open PRs now hold PROVISIONAL numbers that may be
      #   shared, and the rebump job in tag-version moves each one past main
      #   after every merge -- so the number is decided at merge, not at open.)
      #
      # `version-check` above tests INTERNAL consistency -- Makefile VERSION
      # against __init__.py / package.json / VERSION_TXT. It has no notion of a
      # base branch or of another PR, so it passes happily on a PR that changed
      # code and forgot to bump. finzeug/panoptikon#569 merged that way: VERSION
      # stayed on a number #567 had already tagged, tag-version.yml (which then
      # triggered only on Makefile changes) never fired, and the deployed image
      # reported someone else's version.
      #
      # ONE IMPLEMENTATION, shared with self-hosted-ci.yml and version-guard.yml.
      # Both gates were inline in all three files, held by a comment that failed
      # twice (#182, #232) and then by byte-identity tests; the action removes the
      # duplication those tests were watching. The action's header carries the
      # rest, including how it gets its token and what would reverse that.
      #
      # STILL A STEP IN THIS JOB, deliberately: nine repos require the status
      # check `ci / ci`, so a sibling job would report under a context none of
      # them requires and the guard would stop gating merges while looking green.
      #
      # Fully qualified `@main`, never `./`: inside a `workflow_call` a relative
      # `uses:` resolves against the CALLING repo's checkout, where this action
      # does not exist.
      - name: Version guard
        if: github.event_name == 'pull_request'
        uses: bdh-org/dev-common/.github/actions/version-guard@main

      # Registry-image deploys deliver DAGs ONLY when the image bakes them: the
      # merge-to-main pipeline ships the image, and Airflow tasks docker-run into
      # it — a dags/ dir the Dockerfile never COPYs means merged DAG changes
      # silently never land (bdh-org/home-infra#15; bit panoptikon/hog/freddyb).
      - name: DAG delivery guardrail
        run: |
          if [ -d dags ] && [ -f Dockerfile ] && ! grep -Eq '^[[:space:]]*COPY[[:space:]]+.*dags' Dockerfile; then
            echo "::error::dags/ exists but the Dockerfile never COPYs it — DAG changes will not be delivered by the registry image. Add 'COPY dags/ /app/dags/' (bdh-org/home-infra#15)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install project requirements
        if: inputs.install-requirements
        run: pip install -r ${{ inputs.requirements-file }}

      # Ruff is PINNED, and for the formatter that is not optional. `ruff format`
      # changes its output between patch releases, so an unpinned CI installs
      # whatever shipped that morning and a format gate can go red on a day nobody
      # touched any code. It also guarantees CI and a devcontainer disagree.
      #
      # The version comes from common/RUFF_VERSION when the caller's pin is new
      # enough to have it, and otherwise from RUFF_FALLBACK here.
      #
      # The fallback is NOT laziness -- it is the fix for a real ordering bug. This
      # reusable is consumed at @main, but common/ is whatever revision the CALLER
      # pins, which always lags. Requiring the file made every repo's CI fail the
      # moment this step shipped, because no caller's pin had it yet
      # (finzeug/ferret#41). Both paths are pinned, so neither is the condition this
      # exists to remove; the file simply wins once pins catch up, and the two
      # converge without a flag day.
      - name: Install dev tools
        env:
          RUFF_FALLBACK: "0.16.3"
        run: |
          set -eu
          if [ -r common/RUFF_VERSION ]; then
            RUFF_V="$(tr -d '[:space:]' < common/RUFF_VERSION)"
            echo "pinned ruff ${RUFF_V} (from common/RUFF_VERSION)"
          else
            RUFF_V="${RUFF_FALLBACK}"
            echo "pinned ruff ${RUFF_V} (fallback -- this repo's common/ pin predates RUFF_VERSION)"
          fi
          [ -n "$RUFF_V" ] || { echo "::error::no ruff version resolved -- refusing to install an unpinned formatter"; exit 1; }
          pip install "ruff==${RUFF_V}" pytest pytest-cov

      - name: Lint
        if: inputs.run-lint
        run: ruff check .

      # Excludes the VENDORED trees. `ruff format --check .` from the repo root
      # walks the hydrated submodules too, so ferret's first gated run failed on
      # two files belonging to dev-common -- a repo cannot be gated on its
      # dependency's formatting, and the error names files the author of the PR
      # does not own and cannot fix from there (finzeug/ferret#41).
      #
      # Named explicitly rather than added to each repo's ruff.toml: the set is a
      # property of how this fleet vendors (common, stack-common, lib/*), not of
      # any one repo's style, so it belongs with the workflow that walks them.
      - name: Format check
        if: inputs.check-format
        run: ruff format --check --exclude common --exclude stack-common --exclude lib .

      - name: Test
        if: inputs.run-tests
        run: python -m pytest -vv ${{ inputs.test-path }}
