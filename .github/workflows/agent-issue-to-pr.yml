name: agent-issue-to-pr (reusable)
# Reusable (workflow_call) implementation of the headless issue -> PR pipeline
# (home-infra#53/#123). A thin per-repo wrapper owns the triggers -- `issues:
# [labeled]` with the agent-pr/agent-deploy label filter, and `issue_comment:
# [created]` with the `/agent` verb + commenter trust filter -- and CALLS this, so
# the logic lives here once instead of copied into every repo (matches tag-version
# + agent-pr-revise).
#
# Two ways to start a run, same pipeline either way:
#   * apply `agent-pr` (PR left for a human to merge) or `agent-deploy` (auto-merge
#     on a GREEN dev-tier gate) to an issue; or
#   * comment `/agent` on the issue (dev-common#143) -- symmetric with `/revise` on
#     a PR. The label is not touched, and because `github.event.label.name` is empty
#     on that path the agent-deploy auto-merge below never fires: the deploy trust
#     tier stays a label decision.
#
# Then claude-code-action@v1 runs headless on the forge
# self-hosted runner, implements the issue, self-gates, and opens a PR that links the
# issue. Identity: Claude OAuth from Vault (kv/ai/coder/anthropic via coder-ai);
# GitHub ops (checkout/push/PR/merge) on a per-run bdh-org-coder App token
# (home-infra#91). An App-token merge still triggers the registry-image deploy.
#
# A run that opens NO pull request ends RED (dev-common#140): the "Verify a PR
# exists" post-step asks the API what exists on the agent's branch, unconditionally
# and independent of gate_cmd, so a run cannot report success on a deliverable it
# never produced. Either way the outcome lands in the job summary.
#
# The PR always closes its issue (home-site#266). The prompt asks for it, but a
# model complies with "write Closes #N" only most of the time -- and a run that
# forgot merged a PR that left its issue open. The "Ensure the PR closes the
# issue" post-step appends the keyword when it is missing, so the link is a
# property of the workflow rather than of a sample.
#
# An individual run can opt up (or down) from the repo's defaults with directives on
# their own lines, unindented and outside any code block (dev-common#131):
#
#   agent-model: sonnet     # opus | sonnet | haiku, or the full model id
#   agent-turns: 120        # clamped to [10, 200]
#
# WHERE they are read from follows the trigger (dev-common#143): the `/agent` comment
# that started the run, or the issue body on the label path. Only the triggering
# comment -- a `/agent` carrying no directive gets the repo defaults rather than
# inheriting an earlier comment's or the body's, because a budget belongs to a run
# and not to the issue. The verb token is stripped from the first line, so both
#
#   /agent agent-turns: 150      and      /agent
#                                         agent-turns: 150
#
# ask for the same thing.
#
# See the "Resolve model + turn budget" step for the allowlist and the clamp.
on:
  workflow_call:
    inputs:
      gate_cmd:
        description: >
          The repo's authoritative dev-tier gate command WITHOUT the trailing branch
          arg (the workflow appends agent/issue-<n>). Copy it from the repo's old
          standalone gate step -- e.g. "/srv/github-runner/bin/svcdev-gate.sh hog".
          EMPTY = no gate: skips the dev-tier gate AND disables agent-deploy
          auto-merge (PR-only repos like home-infra). For heller's DagBag-parse
          gate pass "/srv/github-runner/bin/dag-parse-gate.sh dags" WITH
          gate_kind: dagparse (dev-common#116).
        type: string
        required: false
        default: ""
      gate_kind:
        description: >
          Gate plumbing flavor; meaningful only when gate_cmd is non-empty.
          "svcdev" (default): deploy+smoke via the claude-dev SSH identity --
          fetches the claude-dev key from Vault. "dagparse": heller-style
          DagBag-parse -- NO claude-dev key; instead a pre-agent registry docker
          login (persisted credential, the agent never holds REGISTRY_RUNNER_PW)
          and DOCKER_HOST exported for the gate's docker runs (dev-common#116).
        type: string
        required: false
        default: "svcdev"
      protected:
        description: >
          Optional override for the agent-deploy auto-merge protected-paths regex
          (agent-automerge.sh denylist). Empty = the script's default. heller
          extends it with dags/ + scripts/ (ledger safety).
        type: string
        required: false
        default: ""
      max_turns:
        description: >
          Default Claude Code --max-turns budget for the agent run, and the fallback
          when an issue asks for something unusable.

          Raised 50 -> 100 (home-infra#367). The old value came with the reasoning
          that "the default caps cost on small issues", and that reasoning is wrong:
          --max-turns is a CEILING, not a budget that gets spent. An issue that
          finishes in 12 turns costs 12 turns whether the cap is 50 or 100, so the
          low default bought nothing on the small issues it was defending and killed
          the large ones outright -- 4 of 6 hog runs on 2026-07-17 (finzeug/hog#335),
          home-infra#215 at turn 51 of 50, two heller runs on 2026-08-10, each losing
          a complete unbilled-but-finite allowance spend for no deliverable. What the
          cap genuinely protects against is a RUNAWAY loop, and 100 still bounds that.

          A per-issue `agent-turns:` directive is still the right tool for the rare
          feature-scale issue (hog carried max_turns: 150 in its wrapper for exactly
          that reason); this default is only the floor under it.
        type: number
        required: false
        default: 100
      model:
        description: >
          Default Claude model for the agent run, and the fallback when an issue asks
          for one outside the allowlist. Must itself be an allowlisted value (see the
          "Resolve model + turn budget" step) or it is ignored in favour of Opus.
        type: string
        required: false
        default: claude-opus-5

jobs:
  # Decide whether the /agent verb was actually said, BEFORE anything expensive.
  #
  # The wrapper's `if:` cannot express the rule everyone assumes -- "a line that
  # begins with /agent". GitHub expressions have startsWith (whole body) and
  # contains (anywhere) and no way to write a newline, so `contains(body,'\n/agent')`
  # matches a literal backslash-n and never fires. That is why
  #
  #     Option B
  #     /agent
  #
  # did nothing, and produced a `skipped` run indistinguishable from no run at all
  # (bdh-org/home-infra#361).
  #
  # So the wrappers now call this workflow for ANY issue comment from a trusted
  # author, and the decision moves here where grep can state it exactly.
  #
  # ubuntu-latest deliberately: no secrets, no checkout, seconds. A comment without
  # the verb must never occupy a forge slot -- forge is the serialized resource and
  # this would otherwise put every issue comment in the queue with production
  # deploys (bdh-org/home-infra#426, #357).
  gate:
    runs-on: ubuntu-latest
    outputs:
      fire: ${{ steps.verb.outputs.fire }}
    steps:
      - name: Was /agent actually said?
        id: verb
        env:
          BODY: ${{ github.event.comment.body }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # The label path has no comment and always fires; only issue_comment is gated.
          if [ "$EVENT" != "issue_comment" ]; then
            echo "fire=true" >> "$GITHUB_OUTPUT"
            echo "event=${EVENT}: not a comment, proceeding"
            exit 0
          fi
          if printf '%s\n' "$BODY" | grep -qE '^/agent([[:space:]]|$)'; then
            echo "fire=true" >> "$GITHUB_OUTPUT"
            echo "found a /agent line -- starting the agent"
          else
            echo "fire=false" >> "$GITHUB_OUTPUT"
            # SAY SO. A silent no-op here is the original complaint: the operator
            # sees a run and cannot tell whether the verb was wrong or the pipeline
            # is broken.
            echo "no line begins with /agent -- not starting the agent."
            echo "The verb must be at the START of a line, on its own or followed by"
            echo "directives, e.g.:"
            echo "    Option B"
            echo "    /agent"
          fi

  agent:
    needs: gate
    if: needs.gate.outputs.fire == 'true'
    runs-on: [self-hosted, forge]
    steps:
      # Mint the running repo's org installation token for the bdh-org-coder App
      # (home-infra#91) -- the headless git actor. checkout persists it for the
      # agent's pushes; the action and the auto-merge step reuse it.
      - name: Mint coder App token (bdh-org-coder)
        id: coder
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: /srv/github-runner/bin/mint-coder-app-token.sh

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.coder.outputs.coder_token }}

      # Hydrate submodules with a token minted for EACH submodule's own org,
      # resolved from .gitmodules -- see the script's header for why the parent
      # repo's org is exactly the wrong signal (dev-common#169). The agent needs
      # every submodule on disk to run `make bump-patch` in-turn (home-infra#89/#91).
      # A repo with no submodules mints nothing and no-ops.
      - name: Hydrate submodules (per-submodule org tokens)
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          set -euo pipefail

          # One installation token PER ORG, and the org comes from the submodule's URL in
          # .gitmodules -- never from the parent repo's org (dev-common#169). panoptikon
          # lives in finzeug and vendors two bdh-org submodules alongside two finzeug
          # ones, so either org taken as the default leaves half of them unclonable.
          # Both directions have already broken a delivery path: bdh-org assumed here
          # (finzeug/panoptikon#700), the parent's org assumed by hand the same morning.
          # Neither org is the right default; the URL is.
          MINT="${MINT:-/srv/github-runner/bin/mint-coder-app-token.sh}"

          # path<TAB>url for every submodule any .gitmodules on disk declares. Nested
          # paths are printed parent-prefixed, exactly the way `git submodule status
          # --recursive` reports them, so the check at the end can look a path up here.
          sm_map() {
            local f dir k p u
            while IFS= read -r f; do
              case "$f" in */.gitmodules) dir="${f%.gitmodules}";; *) dir="";; esac
              while IFS= read -r k; do
                p="$(git config -f "$f" --get "$k")" || continue
                u="$(git config -f "$f" --get "${k%.path}.url")" || u=""
                printf '%s\t%s\n' "${dir}${p}" "$u"
              done < <(git config -f "$f" --name-only --get-regexp '^submodule\..*\.path$' 2>/dev/null || true)
            done < <(find . -name .gitmodules -not -path './.git/*' -printf '%P\n' | sort)
          }

          # The GitHub org owning a submodule URL; empty for anything else -- a relative
          # or non-GitHub URL needs no token of ours and must not cost a mint attempt.
          sm_org() {
            printf '%s\n' "$1" | sed -nE 's#^(https://github\.com/|git@github\.com:)([^/]+)/.*#\2#p'
          }

          # tests/hydrate-submodules.test.sh sources everything above and stops here.
          if [ -n "${HYDRATE_LIB_ONLY:-}" ]; then return 0; fi

          # Credential rewrites an earlier job on this persistent runner left behind.
          for k in $(git config --local --name-only --get-regexp '^url\.' || true); do
            git config --local --unset-all "$k" || true
          done
          # sync FIRST: the persistent runner workspace keeps submodule URLs in
          # .git/modules/*/config, and `submodule init` never overwrites them -- a URL
          # fixed in .gitmodules would otherwise stay broken forever (#105).
          git submodule sync --recursive || true

          declare -A SEEN=()
          CFG=()

          mint() { # org -> append an insteadOf rewrite carrying a token for that org
            local org="$1" out tok
            out="$(mktemp "${RUNNER_TEMP:-/tmp}/hydrate-XXXXXX")"
            # The mint script masks its token by printing ::add-mask:: on STDOUT, so
            # stdout must reach the job log; the value itself only lands in $out, never
            # in a step output (a hydration token is nobody else's business).
            if ! GITHUB_OUTPUT="$out" CODER_TOKEN_ENV_NAME="" "$MINT" "$org"; then
              rm -f "$out"; return 1
            fi
            tok="$(sed -n 's/^coder_token=//p' "$out" | head -1)"
            rm -f "$out"
            [ -n "$tok" ] || return 1
            CFG+=(-c "url.https://x-access-token:${tok}@github.com/${org}/.insteadOf=https://github.com/${org}/")
          }

          # Several passes: a nested submodule's .gitmodules is only readable once its
          # parent is checked out, so an org can first appear mid-hydration. Both the
          # mint and the update are tolerant here -- a mint failure for a directory that
          # merely happens to contain a .gitmodules must not fail the run. The check
          # below is the only thing that decides this step.
          for pass in 1 2 3 4 5; do
            new=0
            while IFS= read -r org; do
              [ -n "$org" ] || continue
              [ -z "${SEEN[$org]:-}" ] || continue
              SEEN[$org]=1
              new=1
              mint "$org" || echo "::warning::could not mint a ${org} token for submodule hydration"
            done < <(sm_map | cut -f2 | while IFS= read -r u; do sm_org "$u"; done | sort -u)
            if [ "$pass" -gt 1 ] && [ "$new" = 0 ]; then break; fi
            git ${CFG[@]+"${CFG[@]}"} submodule update --init --recursive || true
          done

          # Fail LOUDLY, naming the submodule and the org it needed. A submodule the repo
          # declares and this step did not populate must never be handed on as an empty
          # directory for a later step to trip over 40 lines from the cause
          # (home-infra#343, home-infra#359). `submodule status` prefixes '-' for one
          # never initialised and '+' for one left at a commit other than the pin --
          # and '+' is how this bug hid for a month, a stale checkout on the persistent
          # runner standing in for a fetch that never happened.
          bad="$(git submodule status --recursive 2>/dev/null | grep -E '^[-+]' || true)"
          if [ -n "$bad" ]; then
            map="$(sm_map)"
            echo "::error::submodule hydration incomplete -- refusing to run the agent against a partial checkout"
            while read -r rev path _; do
              [ -n "${path:-}" ] || continue
              url="$(printf '%s\n' "$map" | awk -F'\t' -v p="$path" '$1 == p {print $2; exit}')"
              org="$(sm_org "$url")"
              case "$rev" in -*) why="never initialised";; *) why="not at the pinned commit";; esac
              echo "::error::  ${path}: ${why} -- url ${url:-unknown}, org ${org:-unknown}"
            done <<< "$bad"
            echo "If the org is right, check that the bdh-org-coder App is installed there" >&2
            echo "(Vault kv/ai/coder/github-app needs an install_<org> field for it)." >&2
            exit 1
          fi
          git submodule status --recursive | sed 's/^/  /'
          echo "submodule hydration OK"

      - name: Fetch Claude OAuth token from Vault (coder-ai)
        id: vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: /srv/github-runner/bin/vault-fetch-ci-secret.sh

      # claude-dev SSH key for the in-turn self-gate + the post-step gate (svcdev
      # flavor only -- the dagparse gate never SSHes to the dev tier).
      - name: Fetch claude-dev SSH key from Vault
        id: devkey
        if: inputs.gate_cmd != '' && inputs.gate_kind != 'dagparse'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          CODER_SECRET_PATH: kv/ai/coder/claude-dev-ssh
          CODER_SECRET_FIELD: private_key_b64
          SECRET_OUTPUT_NAME: claude_dev_key_b64
          SECRET_ENV_NAME: ""
        run: /srv/github-runner/bin/vault-fetch-ci-secret.sh

      # dagparse gate: the gate docker-runs the shared plugin image, so log in to
      # the registry BEFORE the agent -- the login persists (run-scoped
      # DOCKER_CONFIG, home-infra#154) for the whole job, so the agent's self-gate
      # can pull WITHOUT ever holding the credential. The password comes from
      # VAULT (kv/ci/deploy via deploy-ci -- the same source every ci-build.yml
      # uses), NOT a GitHub secret: org secrets resolve EMPTY through a cross-org
      # `secrets: inherit` reusable call (dev-common#118, caught by heller's
      # first live validation run).
      - name: Fetch registry credential from Vault (deploy-ci)
        id: regpw
        if: inputs.gate_cmd != '' && inputs.gate_kind == 'dagparse'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          CODER_ROLE: deploy-ci
          CODER_SECRET_PATH: kv/ci/deploy
          CODER_SECRET_FIELD: registry_pw
          SECRET_OUTPUT_NAME: registry_pw
          SECRET_ENV_NAME: ""
        run: /srv/github-runner/bin/vault-fetch-ci-secret.sh

      - name: Registry login (dagparse gate)
        if: inputs.gate_cmd != '' && inputs.gate_kind == 'dagparse'
        env:
          DOCKER_HOST: unix:///run/user/996/docker.sock
          DOCKER_CONFIG: /tmp/docker-config-${{ github.run_id }}
        run: echo "${{ steps.regpw.outputs.registry_pw }}" | docker login registry.home.arpa -u runner --password-stdin

      # Per-run cost profile (dev-common#131). The triggering text may carry
      #   agent-model: sonnet
      #   agent-turns: 120
      # on their own lines, so the rare feature-scale issue opts up without every
      # small issue in the repo paying that ceiling (hog carried max_turns: 150 for
      # exactly that reason).
      #
      # WHICH text depends on the trigger (dev-common#143): the `/agent` comment on
      # an issue_comment run, the issue body on a labeled one. Reading the comment is
      # the point of the verb -- the budget is scoped to the run that asked for it
      # instead of sticking to the issue, and a re-run at a new budget is one action
      # rather than "edit body, unlabel, relabel" (which silently runs against the
      # PRE-edit body if done in the other order, because github.event.issue.body is
      # a snapshot from the label event).
      #
      # That text is an INPUT that steers model choice and spend, so it is never
      # passed through: the model must match an allowlist and the turn budget is
      # clamped to [10, 200]. Anything unrecognised warns and falls back to the
      # workflow default rather than failing the run -- an absent or malformed
      # directive is byte-for-byte the previous behaviour. It reaches the script
      # through env, not `${{ }}`, which would splice issue/comment text into the
      # shell source.
      #
      # KEEP IN SYNC with the same step in agent-pr-revise.yml: it reads the
      # `/revise` comment only, and the script below is byte-identical apart from
      # the BODY selection below and the word "agent"/"revision" in the closing
      # ::notice::. These two files duplicate their step chain by design -- no
      # composite action, because cross-repo private actions need an org-wide access
      # grant this does not have -- so the model allowlist lives in two places and
      # drifts silently unless both are edited together (dev-common#142).
      - name: Resolve model + turn budget
        id: budget
        env:
          # Both sources are passed and the script picks by event. NOT a
          # `${{ cond && comment || issue }}` ternary: that falls through to the
          # issue body whenever the comment side is falsy, which would quietly
          # resurrect the sticky-body behaviour for an empty comment.
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DEFAULT_MODEL: ${{ inputs.model }}
          DEFAULT_TURNS: ${{ inputs.max_turns }}
        run: |
          # NO `pipefail`, deliberately: `head -1` closes the pipe on the first
          # match and SIGPIPEs sed, which pipefail would turn into a failed step.
          # With `set -eu` alone the pipeline exits 0. Do not "harden" this.
          set -eu
          MIN_TURNS=10
          MAX_TURNS=200

          # Directives come from the `/agent` comment that started this run, or
          # from the issue body when a label started it -- never both, so a
          # `/agent` with no directive runs at the repo defaults instead of
          # inheriting whatever an earlier comment or the body asked for.
          # Last-request-wins applies only WITHIN the triggering text.
          #
          # The verb token is stripped from the FIRST line before parsing, so the
          # natural one-liner works:
          #   /agent agent-turns: 150
          # Without it the column-0 anchor below (dev-common#142) would never see
          # that directive -- the line starts with `/agent`, not `agent-turns:`.
          # Only the first directive fits on the verb line; a second one still
          # needs a line of its own.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Strip the verb from whichever line carries it, not only line 1: the
            # verb may now sit below an explanation (bdh-org/home-infra#361), and a
            # line-1-only strip would leave `/agent agent-turns: 150` unparsed when
            # written on line 3.
            BODY="$(printf '%s\n' "$COMMENT_BODY" | sed -E 's|^/agent[[:space:]]*||')"
            echo "directive source: the /agent comment"
          else
            BODY="$ISSUE_BODY"
            echo "directive source: the issue body"
          fi

          # One directive out of the body: anchored at COLUMN 0, case-insensitive,
          # first match wins. Fenced code blocks are stripped, and the column-0
          # anchor drops markdown's other quoting forms -- four-space indented
          # blocks, `>` blockquotes, list items -- so a body that *documents* or
          # *quotes* the directives (dev-common#131 and #142 both do) cannot
          # accidentally request them (dev-common#142). `sed -E ... /I` is a GNU
          # extension: fine on the Ubuntu runner, would need rewriting if this
          # block is ever reused on BSD.
          directive() {
            printf '%s\n' "$BODY" | tr -d '\r' \
              | awk '/^[[:space:]]*```/ { fence = !fence; next } !fence' \
              | sed -nE "s/^$1:[[:space:]]*([^[:space:]]+).*/\1/Ip" \
              | head -1
          }

          # An unterminated fence leaves that toggle open, so every directive below
          # it is dropped. Say so instead of ignoring them silently.
          if printf '%s\n' "$BODY" | tr -d '\r' \
               | awk '/^[[:space:]]*```/ { fence = !fence } END { exit !fence }'; then
            echo "::warning::body has an unclosed \`\`\` code fence -- any directive below it is ignored"
          fi

          # Allowlist + clamp. BOTH are applied to the repo default as well, so a
          # wrapper typo cannot smuggle in an arbitrary --model value or uncap spend
          # any more than an over-eager body can (dev-common#142).
          allowlisted() {
            case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
              opus|claude-opus-5)               echo claude-opus-5 ;;
              sonnet|claude-sonnet-5)           echo claude-sonnet-5 ;;
              haiku|claude-haiku-4-5*)          echo claude-haiku-4-5-20251001 ;;
              *)                                echo "" ;;
            esac
          }

          # Echoes the clamped turn count, or "" for a non-number.
          clamp_turns() {
            case "$1" in
              ""|*[!0-9]*) echo "" ;;
              # 5+ digits is over the ceiling by any reading; short-circuit rather
              # than feed a huge literal to $(( )).
              ?????*) echo "$MAX_TURNS" ;;
              *)
                n=$((10#$1))
                [ "$n" -ge "$MIN_TURNS" ] || n="$MIN_TURNS"
                [ "$n" -le "$MAX_TURNS" ] || n="$MAX_TURNS"
                echo "$n" ;;
            esac
          }

          model="$(allowlisted "$DEFAULT_MODEL")"
          if [ -z "$model" ]; then
            echo "::warning::workflow default model '$DEFAULT_MODEL' is not allowlisted -- using claude-opus-5"
            model=claude-opus-5
          fi
          want="$(directive agent-model)"
          if [ -n "$want" ]; then
            picked="$(allowlisted "$want")"
            if [ -n "$picked" ]; then model="$picked"
            else echo "::warning::agent-model '$want' is not allowlisted -- using $model"; fi
          fi

          turns="$(clamp_turns "$DEFAULT_TURNS")"
          if [ -z "$turns" ]; then
            turns="$MAX_TURNS"
            echo "::warning::workflow default max_turns '$DEFAULT_TURNS' is not a number -- using $turns"
          elif [ "$turns" != "$DEFAULT_TURNS" ]; then
            echo "::warning::workflow default max_turns $DEFAULT_TURNS clamped to $turns (allowed $MIN_TURNS-$MAX_TURNS)"
          fi
          want="$(directive agent-turns)"
          if [ -n "$want" ]; then
            picked="$(clamp_turns "$want")"
            if [ -z "$picked" ]; then
              echo "::warning::agent-turns '$want' is not a number -- using $turns"
            else
              [ "$picked" = "$want" ] || echo "::warning::agent-turns $want clamped to $picked (allowed $MIN_TURNS-$MAX_TURNS)"
              turns="$picked"
            fi
          fi

          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "turns=$turns" >> "$GITHUB_OUTPUT"
          # Echoed so a run's cost profile is readable after the fact, not inferred.
          echo "::notice::agent run budget -- model=$model max-turns=$turns (repo defaults: $DEFAULT_MODEL / $DEFAULT_TURNS)"

      - uses: anthropics/claude-code-action@v1
        id: agent
        env:
          CLAUDE_DEV_SSH: ${{ vars.CLAUDE_DEV_SSH }}
          KEY_B64: ${{ steps.devkey.outputs.claude_dev_key_b64 }}
          GH_TOKEN: ${{ steps.coder.outputs.coder_token }}
          GATE_CMD: ${{ inputs.gate_cmd }}
          # dagparse: the gate's docker calls need the forge rootless daemon and the
          # run-scoped config holding the registry login; empty (svcdev/no-gate) is
          # ignored by the docker CLI.
          DOCKER_HOST: ${{ inputs.gate_kind == 'dagparse' && 'unix:///run/user/996/docker.sock' || '' }}
          DOCKER_CONFIG: ${{ inputs.gate_kind == 'dagparse' && format('/tmp/docker-config-{0}', github.run_id) || '' }}
        with:
          claude_code_oauth_token: ${{ steps.vault.outputs.oauth_token }}
          github_token: ${{ steps.coder.outputs.coder_token }}
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in this repository.

            Title: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            ${{ github.event_name == 'issue_comment' && format('ALSO READ THIS -- the run was triggered by a comment, not a label, and the comment may carry a DECISION or instruction the issue body does not. An operator answering "pick A or B" writes the answer here, not in the body. Treat it as part of the task; where it conflicts with the body, the comment is newer and wins. Comment: {0}', github.event.comment.body) || '' }}

            Create a branch named `agent/issue-${{ github.event.issue.number }}`, commit
            with conventional-commit style, and PUSH it. Follow this repository's CLAUDE.md
            conventions. Never commit directly to main.

            Run the repo's fast local checks and fix any failures FIRST: `make
            version-check` and `make lint` (ignore "No rule to make target" if a repo
            doesn't have one). For any version change ALWAYS use `make bump-patch` --
            never hand-edit version strings, or the Makefile VERSION and __version__ drift
            and CI's version-check fails. Re-run until both pass.

            If (and only if) the env var GATE_CMD is non-empty, VERIFY on the dev tier
            BEFORE opening the PR by running this exact command:
              $GATE_CMD agent/issue-${{ github.event.issue.number }}
            ${{ inputs.gate_kind == 'dagparse' && 'It DagBag-parses dags/ against the shared dag_log_levels plugin; exit 0 = green (0 import errors).' || 'It deploys your pushed branch to the dev tier and smokes it; exit 0 = green.' }}
            If it FAILS, read the output, fix, commit, push, and re-run the SAME command --
            up to 3 attempts total.

            Finally open a pull request whose body says
            "Closes #${{ github.event.issue.number }}":
            - if the gate is GREEN (or there is no gate), open a normal PR;
            - if it is STILL failing after 3 attempts, open a DRAFT pull request whose body
              explains what is still red (include the gate's final output).
          claude_args: |
            --model ${{ steps.budget.outputs.model }}
            --max-turns ${{ steps.budget.outputs.turns }}
            --allowedTools "Read,Write,Edit,Bash"

      # Guarantee the issue link (home-site#266). The prompt above ASKS for
      # "Closes #<n>" in the PR body, and the model complies most of the time --
      # which is the bug: home-site#266 merged a PR that never closed its issue,
      # while the run before it did. A closing keyword is not a judgement call,
      # so it must not be left to a sampler.
      #
      # This step writes it. The workflow already knows the issue number exactly
      # (it is the trigger event), so it only has to find the PR and, if no
      # closing reference to THAT issue is already there, append one. Idempotent:
      # a body the agent got right is left byte-for-byte alone, so re-running a
      # run does not stack duplicate lines.
      #
      # Ordering matters twice. It runs BEFORE the auto-merge step, because a
      # keyword added to an already-merged PR closes nothing -- GitHub evaluates
      # the body at merge time. And it runs BEFORE "Verify a PR exists", so the
      # deliverable check stays the single place that decides red/green on a
      # missing PR: no PR here is a notice, never a failure.
      #
      # python3 + the REST API rather than the `gh pr edit` the issue sketched:
      # the forge runner has no `gh` on PATH, and the step below already
      # establishes urllib as how this workflow asks GitHub what exists.
      - name: Ensure the PR closes the issue
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        env:
          # The coder App token, not github.token: it opened the PR, it is the
          # identity the auto-merge step already writes with, and it does not
          # depend on the CALLER granting `pull-requests: write` (a reusable
          # inherits the caller's permissions block, and not every wrapper in
          # the org spells that one out).
          GH_TOKEN: ${{ steps.coder.outputs.coder_token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: agent/issue-${{ github.event.issue.number }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          repo, owner = os.environ["REPO"], os.environ["OWNER"]
          branch, issue = os.environ["BRANCH"], os.environ["ISSUE"]

          def api(path, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}", data=data, method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          # Only OPEN PRs: a merged or closed one cannot be made to close
          # anything by editing it now. Same trailing-list tolerance as the
          # verify step -- a PR opened in the agent's last turn can lag.
          pr = None
          for attempt in (1, 2):
              pulls = api(f"pulls?state=open&head={owner}:{branch}&per_page=100") or []
              if pulls:
                  pr = pulls[0]
                  break
              if attempt == 2:
                  break
              time.sleep(10)

          if pr is None:
              # Not an error HERE. "Verify a PR exists" owns that verdict, and
              # it distinguishes "merged already" from "never opened".
              print(f"::notice::No open PR on {branch} to link to issue #{issue} "
                    "-- leaving the verdict to the deliverable check")
              raise SystemExit(0)

          body = pr.get("body") or ""

          # GitHub's closing keywords, as documented, against `#<n>` or the full
          # issue URL -- so a body that already links the issue in either form is
          # left alone. Deliberately NOT trying to honour markdown quoting: the
          # cost of a false "already there" is an issue that stays open (the bug),
          # while the cost of a false "missing" is one redundant line.
          KEYWORDS = r"clos(?:e|es|ed)|fix(?:|es|ed)|resolv(?:e|es|ed)"
          ref = rf"(?:#{issue}|https://github\.com/{re.escape(repo)}/issues/{issue})"
          if re.search(rf"\b(?:{KEYWORDS})\b[\s:]*{ref}(?![0-9])", body, re.I):
              print(f"::notice::PR #{pr['number']} already closes issue #{issue} "
                    "-- body unchanged")
              raise SystemExit(0)

          new_body = (body.rstrip() + "\n\nCloses #" + issue + "\n").lstrip("\n")
          api(f"pulls/{pr['number']}", method="PATCH", payload={"body": new_body})
          print(f"::notice::Appended 'Closes #{issue}' to PR #{pr['number']} "
                "-- the agent did not write a closing keyword")

          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a") as fh:
                  fh.write(f"\nAdded `Closes #{issue}` to [PR #{pr['number']}]"
                           f"({pr['html_url']}) -- the agent's body did not link "
                           "the issue.\n")
          PY

      # Deliverable check (dev-common#140) -- UNCONDITIONAL, unlike the gate below. Six
      # repos call this reusable with an EMPTY gate_cmd, so for them the gate step is
      # skipped and the agent's own exit code was the only verdict: a run that implemented
      # the issue, failed to push, posted the finished patch as an issue comment and exited
      # 0 still went GREEN (dev-common#131, three times on 2026-08-02 -- the green status
      # read as "not picked up yet", so the issue was re-triggered twice and each retry
      # re-did the work and re-spent the shared subscription allowance). And even where the
      # gate does run, it verifies the DEV TIER, not this run's stated deliverable.
      #
      # So ask GitHub what exists rather than trusting an exit code or grepping the agent's
      # log (the verification-discipline skill). No PR = red, and the red run is the signal
      # that stops the pointless retry.
      #
      # Now a forge SCRIPT rather than the inline python this used to be (home-infra#367),
      # for two reasons that are really one reason:
      #
      #   * It reports the failure ON THE ISSUE, not only in the Actions tab. Two heller
      #     runs died on 2026-08-10 and the issues showed nothing at all -- no comment, no
      #     assignee, label still applied -- so they read as untouched work while the
      #     allowance had already been spent twice. The script also CLEARS the trigger
      #     label, because `issues: [labeled]` fires on the act of labelling and re-applying
      #     one the issue already carries starts nothing: a second, independent silence.
      #
      #   * Logic that lives in a workflow YAML cannot be tested, and this logic was wrong.
      #     Every no-branch case ended with "the push was rejected (e.g. the App token lacks
      #     `workflows: write`)" -- a guess, printed as a finding, and flatly wrong for the
      #     turn-cap deaths it was attached to. The script reads the agent's own execution
      #     file for `subtype: error_max_turns` and asserts that BEFORE any permissions
      #     hint. home-infra drives it against a stub API in CI, including that case.
      #
      # Runs whenever the agent ran, pass or fail -- a max-turns death is already red, but
      # the outcome should still reach the issue. Skipped only when the agent never ran at
      # all (Vault/checkout failure upstream).
      - name: Report the run's outcome (PR check + issue comment)
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        env:
          # The coder App token, NOT github.token: this step comments on the issue and
          # clears the trigger label, and the App installation carries issues:write across
          # both orgs where a caller wrapper's `permissions:` block is the caller's to get
          # wrong. The auto-merge step below already comments with the same identity.
          GH_TOKEN: ${{ steps.coder.outputs.coder_token }}
          ISSUE: ${{ github.event.issue.number }}
          # The agent's own account of what happened, so the reason is read rather than
          # guessed. Both are empty if the action did not get far enough to write them,
          # which the script tolerates by falling back to the API-only classification.
          AGENT_CONCLUSION: ${{ steps.agent.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          MAX_TURNS: ${{ steps.budget.outputs.turns }}
          # Empty on the `/agent` comment path -- that run carries no label to clear.
          TRIGGER_LABEL: ${{ github.event.label.name }}
        run: |
          set -eu
          S=/srv/github-runner/bin/agent-report-outcome.sh
          if [ ! -x "$S" ]; then
            # Fail rather than skip. This step IS the deliverable check; a missing script
            # silently passing would restore the exact false green dev-common#140 removed.
            echo "::error::${S} is not installed on this runner. It ships from home-infra: run \`make forge-gate-redeploy\` there (the script is in GATE_SCRIPTS). Refusing to report on a deliverable this step could not check."
            exit 1
          fi
          "$S" "agent/issue-${ISSUE}"

      # Authoritative dev-tier gate (post-step) -- re-runs the SAME gate as the final
      # verdict so the PR gets a real commit status regardless of the agent's turns.
      - name: Dev-tier gate (deploy + smoke)
        if: inputs.gate_cmd != ''
        env:
          CLAUDE_DEV_SSH: ${{ vars.CLAUDE_DEV_SSH }}
          GH_TOKEN: ${{ github.token }}
          KEY_B64: ${{ steps.devkey.outputs.claude_dev_key_b64 }}
          DOCKER_HOST: ${{ inputs.gate_kind == 'dagparse' && 'unix:///run/user/996/docker.sock' || '' }}
          DOCKER_CONFIG: ${{ inputs.gate_kind == 'dagparse' && format('/tmp/docker-config-{0}', github.run_id) || '' }}
        run: ${{ inputs.gate_cmd }} "agent/issue-${{ github.event.issue.number }}"

      # agent-deploy trust tier: on a green gate, auto-merge (unless a protected path was
      # touched -> the shared script downgrades to manual review). Only for gated repos --
      # a no-gate repo never auto-merges (nothing verified the change).
      #
      # A `/agent`-comment run (dev-common#143) carries no label, so
      # github.event.label.name is empty and this step is skipped: the comment verb
      # starts a run, it does not grant the deploy trust tier. Ask for that with the
      # agent-deploy label, as before.
      - name: Auto-merge on green gate (agent-deploy)
        if: github.event.label.name == 'agent-deploy' && inputs.gate_cmd != ''
        env:
          GH_TOKEN: ${{ steps.coder.outputs.coder_token }}
          # Empty falls through to agent-automerge.sh's default denylist (":-").
          PROTECTED: ${{ inputs.protected }}
        run: /srv/github-runner/bin/agent-automerge.sh "agent/issue-${{ github.event.issue.number }}"
