name: agent-pr-revise (reusable)
# Reusable (workflow_call) implementation of the agent PR-revision pipeline
# (home-infra#88/#123). A thin per-repo wrapper (.github/workflows/agent-pr-revise.yml)
# owns the `issue_comment` trigger + the `/revise` filter and CALLS this, so the
# logic lives here once instead of copied into every repo (matches tag-version).
#
# Turns a `/revise ...` comment on ANY open same-repo PR into more commits on
# the SAME branch: checks out that branch, makes the requested changes,
# optionally self-gates on svc-dev, and pushes -- updating the PR in place.
#
# /revise is a DELEGATION verb: a trusted human hands work on a PR to the AI,
# end of story (#107). So it deliberately does NOT care whose PR it is or how
# the branch is named (it originally accepted only the headless pipeline's
# agent/issue-* branches -- twice too narrow); authorization is the wrapper's
# commenter trust filter alone. The only skips are PRs a revision push cannot
# land on: closed PRs and fork-headed PRs.
#
# Does NOT open a new PR and does NOT auto-merge (a human asked for
# changes, so they re-review). Identity: pushes ride a per-run bdh-org-coder App
# installation token (home-infra#91); the Claude OAuth token comes from Vault
# (coder-ai). Runs on the shared forge self-hosted runner.
#
# A run that pushes NO commit ends RED (dev-common#140): the "Verify the revision
# pushed" post-step compares the PR's head SHA against the one resolved before the
# agent ran, unconditionally and independent of gate_cmd, so a run cannot report
# success on a revision that never landed. Either way it lands in the job summary.
#
# An individual request can opt up (or down) from the repo's defaults by putting
# directives on their own lines in the `/revise` comment, unindented and outside any
# code block (dev-common#131):
#
#   agent-model: sonnet     # opus | sonnet | haiku, or the full model id
#   agent-turns: 120        # clamped to [10, 200]
#
# See the "Resolve model + turn budget" step for the allowlist and the clamp.
on:
  workflow_call:
    inputs:
      gate_cmd:
        description: >
          The repo's authoritative post-step gate command, WITHOUT the trailing
          branch argument (the workflow appends the PR head ref). Copy it from the
          repo's agent-issue-to-pr.yml gate step -- e.g.
          "/srv/github-runner/bin/svcdev-gate.sh hog" for a deployable service, or
          "/srv/github-runner/bin/dag-parse-gate.sh heller" for an airflow-only one.
          Leave EMPTY to skip the gate entirely (repos with no dev-tier gate, e.g.
          home-infra).
        type: string
        required: false
        default: ""
      gate_kind:
        description: >
          Gate plumbing flavor; meaningful only when gate_cmd is non-empty.
          "svcdev" (default): deploy+smoke via the claude-dev SSH identity --
          fetches the claude-dev key from Vault. "dagparse": heller-style
          DagBag-parse -- NO claude-dev key; instead a pre-agent registry docker
          login (persisted credential, the agent never holds REGISTRY_RUNNER_PW)
          and DOCKER_HOST exported for the gate's docker runs (dev-common#116).
        type: string
        required: false
        default: "svcdev"
      max_turns:
        description: >
          Default Claude Code --max-turns budget for the revision run, and the
          fallback when a comment asks for something unusable. Default matches
          agent-issue-to-pr; revisions are usually smaller than the original
          implementation, so most wrappers should leave this alone and let the one
          big revision ask for more with an `agent-turns:` directive
          (dev-common#131).
        type: number
        required: false
        default: 50
      model:
        description: >
          Default Claude model for the revision run, and the fallback when a comment
          asks for one outside the allowlist. Must itself be an allowlisted value
          (see the "Resolve model + turn budget" step) or it is ignored in favour of
          Opus.
        type: string
        required: false
        default: claude-opus-5

jobs:
  revise:
    runs-on: [self-hosted, forge]
    steps:
      # issue_comment carries the PR number (github.event.issue.number) but NOT its
      # head branch -- resolve it from the API (curl+python3; gh is not on every org
      # runner's PATH). Any open same-repo PR qualifies (#107): authorization is the
      # wrapper's commenter trust filter. Guard only what cannot work -- a closed PR
      # (branch may be gone) and a fork PR (the coder token cannot push to a fork).
      - name: Resolve + validate PR head branch
        id: pr
        run: |
          pr="$(curl -sS -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")"
          ref="$(printf '%s' "$pr" | python3 -c 'import sys,json;print(json.load(sys.stdin)["head"]["ref"])')"
          state="$(printf '%s' "$pr" | python3 -c 'import sys,json;print(json.load(sys.stdin)["state"])')"
          headrepo="$(printf '%s' "$pr" | python3 -c 'import sys,json;print(json.load(sys.stdin)["head"]["repo"]["full_name"])')"
          # The head SHA BEFORE the agent runs -- the deliverable check below
          # compares it against what the API reports afterwards (dev-common#140).
          sha="$(printf '%s' "$pr" | python3 -c 'import sys,json;print(json.load(sys.stdin)["head"]["sha"])')"
          echo "PR #${{ github.event.issue.number }} head branch = $ref @ $sha (state: $state, head repo: $headrepo)"
          if [ "$state" != "open" ]; then
            echo "::notice::PR is $state, not open -- ignoring /revise"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$headrepo" != "${{ github.repository }}" ]; then
            echo "::notice::head branch lives in fork $headrepo -- cannot push a revision, ignoring /revise"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge
        if: steps.pr.outputs.skip != 'true'
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d '{"body":"On it -- revising `${{ steps.pr.outputs.ref }}` per your request."}' \
            >/dev/null 2>&1 || true

      - name: Mint coder App token (bdh-org-coder)
        id: coder
        if: steps.pr.outputs.skip != 'true'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: /srv/github-runner/bin/mint-coder-app-token.sh

      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != 'true'
        with:
          ref: ${{ steps.pr.outputs.ref }}   # the PR head branch, not main
          token: ${{ steps.coder.outputs.coder_token }}

      # Submodules (common/, stack-common/) live in bdh-org; hydrate with a bdh-org
      # coder token regardless of this repo's org (same wiring as agent-issue-to-pr).
      # A repo with no submodules just no-ops the update.
      - name: Mint bdh-org coder token (submodule hydration)
        id: coderbdh
        if: steps.pr.outputs.skip != 'true'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: /srv/github-runner/bin/mint-coder-app-token.sh bdh-org

      - name: Hydrate submodules (bdh-org)
        if: steps.pr.outputs.skip != 'true'
        env:
          T: ${{ steps.coderbdh.outputs.coder_token }}
        run: |
          for k in $(git config --local --name-only --get-regexp '^url\.' || true); do
            git config --local --unset-all "$k" || true
          done
          # sync FIRST: the persistent runner workspace keeps submodule URLs in
          # .git/modules/*/config, and `submodule init` never overwrites them --
          # a URL fixed in .gitmodules would otherwise stay broken forever (#105).
          git submodule sync --recursive || true
          git -c "url.https://x-access-token:${T}@github.com/bdh-org/.insteadOf=https://github.com/bdh-org/" \
            submodule update --init --recursive

      - name: Fetch Claude OAuth token from Vault (coder-ai)
        id: vault
        if: steps.pr.outputs.skip != 'true'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: /srv/github-runner/bin/vault-fetch-ci-secret.sh

      # claude-dev SSH key for the in-turn self-gate (svcdev flavor only -- the
      # dagparse gate never SSHes to the dev tier).
      - name: Fetch claude-dev SSH key from Vault
        id: devkey
        if: steps.pr.outputs.skip != 'true' && inputs.gate_cmd != '' && inputs.gate_kind != 'dagparse'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          CODER_SECRET_PATH: kv/ai/coder/claude-dev-ssh
          CODER_SECRET_FIELD: private_key_b64
          SECRET_OUTPUT_NAME: claude_dev_key_b64
          SECRET_ENV_NAME: ""
        run: /srv/github-runner/bin/vault-fetch-ci-secret.sh

      # dagparse gate: log in to the registry BEFORE the agent -- the login persists
      # (run-scoped DOCKER_CONFIG, home-infra#154) for the whole job, so the agent's
      # self-gate can pull the plugin image WITHOUT ever holding the credential.
      # Password from VAULT (kv/ci/deploy via deploy-ci, same as ci-build), NOT a
      # GitHub secret: org secrets resolve EMPTY through a cross-org
      # `secrets: inherit` reusable call (dev-common#118).
      - name: Fetch registry credential from Vault (deploy-ci)
        id: regpw
        if: steps.pr.outputs.skip != 'true' && inputs.gate_cmd != '' && inputs.gate_kind == 'dagparse'
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          CODER_ROLE: deploy-ci
          CODER_SECRET_PATH: kv/ci/deploy
          CODER_SECRET_FIELD: registry_pw
          SECRET_OUTPUT_NAME: registry_pw
          SECRET_ENV_NAME: ""
        run: /srv/github-runner/bin/vault-fetch-ci-secret.sh

      - name: Registry login (dagparse gate)
        if: steps.pr.outputs.skip != 'true' && inputs.gate_cmd != '' && inputs.gate_kind == 'dagparse'
        env:
          DOCKER_HOST: unix:///run/user/996/docker.sock
          DOCKER_CONFIG: /tmp/docker-config-${{ github.run_id }}
        run: echo "${{ steps.regpw.outputs.registry_pw }}" | docker login registry.home.arpa -u runner --password-stdin

      # Per-request cost profile (dev-common#131) -- the same block
      # agent-issue-to-pr.yml runs against the issue body, here against the
      # `/revise` comment:
      #   agent-model: sonnet
      #   agent-turns: 120
      # The comment steers model choice and spend, so nothing passes through: the
      # model must match an allowlist and the turn budget is clamped to [10, 200].
      # Anything unrecognised warns and falls back to the workflow default rather
      # than failing the run, so an absent or malformed directive behaves exactly as
      # before. The body arrives via env, not `${{ }}`, which would splice comment
      # text into the shell source.
      #
      # KEEP IN SYNC with the same step in agent-issue-to-pr.yml: it reads the issue
      # body instead of the `/revise` comment, and the script below is
      # byte-identical apart from the word "revision"/"agent" in the closing
      # ::notice::. These two files duplicate their step chain by design -- no
      # composite action, because cross-repo private actions need an org-wide access
      # grant this does not have -- so the model allowlist lives in two places and
      # drifts silently unless both are edited together (dev-common#142).
      - name: Resolve model + turn budget
        id: budget
        if: steps.pr.outputs.skip != 'true'
        env:
          BODY: ${{ github.event.comment.body }}
          DEFAULT_MODEL: ${{ inputs.model }}
          DEFAULT_TURNS: ${{ inputs.max_turns }}
        run: |
          # NO `pipefail`, deliberately: `head -1` closes the pipe on the first
          # match and SIGPIPEs sed, which pipefail would turn into a failed step.
          # With `set -eu` alone the pipeline exits 0. Do not "harden" this.
          set -eu
          MIN_TURNS=10
          MAX_TURNS=200

          # One directive out of the body: anchored at COLUMN 0, case-insensitive,
          # first match wins. Fenced code blocks are stripped, and the column-0
          # anchor drops markdown's other quoting forms -- four-space indented
          # blocks, `>` blockquotes, list items -- so a body that *documents* or
          # *quotes* the directives (dev-common#131 and #142 both do) cannot
          # accidentally request them (dev-common#142). `sed -E ... /I` is a GNU
          # extension: fine on the Ubuntu runner, would need rewriting if this
          # block is ever reused on BSD.
          directive() {
            printf '%s\n' "$BODY" | tr -d '\r' \
              | awk '/^[[:space:]]*```/ { fence = !fence; next } !fence' \
              | sed -nE "s/^$1:[[:space:]]*([^[:space:]]+).*/\1/Ip" \
              | head -1
          }

          # An unterminated fence leaves that toggle open, so every directive below
          # it is dropped. Say so instead of ignoring them silently.
          if printf '%s\n' "$BODY" | tr -d '\r' \
               | awk '/^[[:space:]]*```/ { fence = !fence } END { exit !fence }'; then
            echo "::warning::body has an unclosed \`\`\` code fence -- any directive below it is ignored"
          fi

          # Allowlist + clamp. BOTH are applied to the repo default as well, so a
          # wrapper typo cannot smuggle in an arbitrary --model value or uncap spend
          # any more than an over-eager body can (dev-common#142).
          allowlisted() {
            case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
              opus|claude-opus-5)               echo claude-opus-5 ;;
              sonnet|claude-sonnet-5)           echo claude-sonnet-5 ;;
              haiku|claude-haiku-4-5*)          echo claude-haiku-4-5-20251001 ;;
              *)                                echo "" ;;
            esac
          }

          # Echoes the clamped turn count, or "" for a non-number.
          clamp_turns() {
            case "$1" in
              ""|*[!0-9]*) echo "" ;;
              # 5+ digits is over the ceiling by any reading; short-circuit rather
              # than feed a huge literal to $(( )).
              ?????*) echo "$MAX_TURNS" ;;
              *)
                n=$((10#$1))
                [ "$n" -ge "$MIN_TURNS" ] || n="$MIN_TURNS"
                [ "$n" -le "$MAX_TURNS" ] || n="$MAX_TURNS"
                echo "$n" ;;
            esac
          }

          model="$(allowlisted "$DEFAULT_MODEL")"
          if [ -z "$model" ]; then
            echo "::warning::workflow default model '$DEFAULT_MODEL' is not allowlisted -- using claude-opus-5"
            model=claude-opus-5
          fi
          want="$(directive agent-model)"
          if [ -n "$want" ]; then
            picked="$(allowlisted "$want")"
            if [ -n "$picked" ]; then model="$picked"
            else echo "::warning::agent-model '$want' is not allowlisted -- using $model"; fi
          fi

          turns="$(clamp_turns "$DEFAULT_TURNS")"
          if [ -z "$turns" ]; then
            turns="$MAX_TURNS"
            echo "::warning::workflow default max_turns '$DEFAULT_TURNS' is not a number -- using $turns"
          elif [ "$turns" != "$DEFAULT_TURNS" ]; then
            echo "::warning::workflow default max_turns $DEFAULT_TURNS clamped to $turns (allowed $MIN_TURNS-$MAX_TURNS)"
          fi
          want="$(directive agent-turns)"
          if [ -n "$want" ]; then
            picked="$(clamp_turns "$want")"
            if [ -z "$picked" ]; then
              echo "::warning::agent-turns '$want' is not a number -- using $turns"
            else
              [ "$picked" = "$want" ] || echo "::warning::agent-turns $want clamped to $picked (allowed $MIN_TURNS-$MAX_TURNS)"
              turns="$picked"
            fi
          fi

          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "turns=$turns" >> "$GITHUB_OUTPUT"
          # Echoed so a run's cost profile is readable after the fact, not inferred.
          echo "::notice::revision run budget -- model=$model max-turns=$turns (repo defaults: $DEFAULT_MODEL / $DEFAULT_TURNS)"

      - uses: anthropics/claude-code-action@v1
        id: agent
        if: steps.pr.outputs.skip != 'true'
        env:
          CLAUDE_DEV_SSH: ${{ vars.CLAUDE_DEV_SSH }}
          KEY_B64: ${{ steps.devkey.outputs.claude_dev_key_b64 }}
          GH_TOKEN: ${{ steps.coder.outputs.coder_token }}
          GATE_CMD: ${{ inputs.gate_cmd }}
          # dagparse: the gate's docker calls need the forge rootless daemon and the
          # run-scoped config holding the registry login; empty (svcdev/no-gate) is
          # ignored by the docker CLI.
          DOCKER_HOST: ${{ inputs.gate_kind == 'dagparse' && 'unix:///run/user/996/docker.sock' || '' }}
          DOCKER_CONFIG: ${{ inputs.gate_kind == 'dagparse' && format('/tmp/docker-config-{0}', github.run_id) || '' }}
        with:
          claude_code_oauth_token: ${{ steps.vault.outputs.oauth_token }}
          github_token: ${{ steps.coder.outputs.coder_token }}
          prompt: |
            A reviewer requested changes on an OPEN pull request in this repository.
            The PR's branch `${{ steps.pr.outputs.ref }}` is already checked out.

            Reviewer's revision request (ignore the leading `/revise` token):
            ${{ github.event.comment.body }}

            Make ONLY the requested changes on the current branch. Follow this
            repository's CLAUDE.md conventions. Do NOT open a new pull request -- one
            already exists; you are updating it. Do NOT merge.

            Address EVERY part of the request. If a part is beyond what you can
            do here (needs a human decision, credentials, a different repo),
            still address it in your completion comment (below) -- never drop a
            part silently.

            Run the repo's fast local checks and fix any failures FIRST: `make
            version-check` and `make lint` (ignore "No rule to make target" if a repo
            doesn't have one). For any version change ALWAYS use `make bump-patch` --
            never hand-edit version strings. Re-run until both pass.

            If (and only if) the env var GATE_CMD is non-empty, also VERIFY on the
            dev tier by running exactly:
              $GATE_CMD ${{ steps.pr.outputs.ref }}
            ${{ inputs.gate_kind == 'dagparse' && 'It DagBag-parses dags/ against the shared dag_log_levels plugin; exit 0 = green (0 import errors).' || 'exit 0 = green.' }}
            If it FAILS, read the output, fix, commit, push, re-run the
            SAME command -- up to 3 attempts total.

            Finally COMMIT (conventional-commit style) and PUSH to the SAME branch
            (`${{ steps.pr.outputs.ref }}`), which updates the existing PR.

            REQUIRED last step -- post ONE completion comment on the PR
            (`gh` may be absent; use curl with $GH_TOKEN:
              curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
                -d "$(python3 -c 'import json,sys;print(json.dumps({"body":sys.stdin.read()}))' <<'BODY'
            ...your summary...
            BODY
            )" )
            summarizing: (a) what you changed and pushed, (b) any part of the
            request you did NOT complete and why, (c) the gate result if you ran
            one. A run that ends without this comment is a FAILED revision even
            if the code pushed -- the requester must never have to inspect
            commits to learn what happened (dev-common#112).
          claude_args: |
            --model ${{ steps.budget.outputs.model }}
            --max-turns ${{ steps.budget.outputs.turns }}
            --allowedTools "Read,Write,Edit,Bash"

      # Deliverable check (dev-common#140) -- UNCONDITIONAL, unlike the gate below.
      # Here the deliverable is a pushed commit on the EXISTING PR, so compare the
      # head SHA the API reports now against the one resolved before the agent ran.
      # Same reasoning as agent-issue-to-pr: with an empty gate_cmd nothing but the
      # agent's exit code judged the run, and an agent that makes the change, fails
      # to push, and comments the patch instead exits 0 and goes green.
      #
      # A revision that deliberately changes nothing lands here too, and is red on
      # purpose: /revise asks for commits, so "no commit" needs a human to look.
      - name: Verify the revision pushed
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          REF: ${{ steps.pr.outputs.ref }}
          BEFORE: ${{ steps.pr.outputs.sha }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, time, urllib.request

          repo, number = os.environ["REPO"], os.environ["PR"]
          ref, before = os.environ["REF"], os.environ["BEFORE"]

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def say(*lines):
              """Echo to the log AND the job summary, so the run list itself
              distinguishes a pushed revision from a no-op one."""
              for line in lines:
                  print(line)
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a") as fh:
                      fh.write("\n".join(lines) + "\n")

          for attempt in (1, 2):
              pr = api(f"pulls/{number}")
              after = pr["head"]["sha"]
              # A push in the agent's final turn can trail the API by a moment; a
              # false red would be as bad as the false green it replaces.
              if after != before or attempt == 2:
                  break
              time.sleep(10)

          if after != before:
              say(f"### Revision pushed to PR #{number}",
                  f"`{ref}` {before[:7]} -> {after[:7]} -- {pr['html_url']}")
              raise SystemExit(0)

          why = ("the push was rejected (e.g. the App token lacks a permission "
                 "this change needs, such as `workflows: write`), the agent "
                 "declined, or it ran out of turns first")
          print(f"::error::PR #{number} head is still {before[:7]} -- no revision "
                f"commit landed: {why}")
          say(f"### No revision commit on PR #{number}",
              f"`{ref}` is still at {before[:7]}: {why}.",
              "",
              "This run is red because nothing landed on the PR, not because the "
              "agent crashed. Read the agent's comment on the PR before "
              "re-requesting -- a repeat without a fix re-does the same work.")
          raise SystemExit(1)
          PY

      # Authoritative dev-tier gate (post-step), only for repos with a gate command.
      # gate_cmd is the full command sans branch (e.g. ".../svcdev-gate.sh hog");
      # the PR head ref is appended here.
      - name: Dev-tier gate (deploy + smoke)
        if: steps.pr.outputs.skip != 'true' && inputs.gate_cmd != ''
        env:
          CLAUDE_DEV_SSH: ${{ vars.CLAUDE_DEV_SSH }}
          GH_TOKEN: ${{ github.token }}
          KEY_B64: ${{ steps.devkey.outputs.claude_dev_key_b64 }}
          DOCKER_HOST: ${{ inputs.gate_kind == 'dagparse' && 'unix:///run/user/996/docker.sock' || '' }}
          DOCKER_CONFIG: ${{ inputs.gate_kind == 'dagparse' && format('/tmp/docker-config-{0}', github.run_id) || '' }}
        run: ${{ inputs.gate_cmd }} "${{ steps.pr.outputs.ref }}"
