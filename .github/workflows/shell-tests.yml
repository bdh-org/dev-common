name: Shell tests

# dev-common's OWN gate (bdh-org/dev-common#157) -- not a reusable workflow, and
# not to be copied into consumer repos.
#
# Everything else in .github/workflows/ here is a template or a `workflow_call`
# implementation that runs on OTHER repos' events, which left this repo's own
# shell scripts with no PR-triggered check at all. That matters most for
# devcontainer/setup-claude-identity.sh: it runs during setup in every
# devcontainer across all 16 repos, writes to a bind-mounted gitconfig SHARED by
# every container, and until now merged on nothing stronger than the author
# having run it by hand against a temp $HOME.
#
# No `paths:` filter. The job is a few seconds of bash, and a path-filtered check
# is one that can never be required: a PR it skips reports no status at all
# rather than a green one.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Catches the typo class that `set -euo pipefail` cannot: a script that
      # never parses fails at container-setup time, on every rebuild, for
      # whoever pulls the submodule next.
      - name: Syntax-check every shell script
        run: |
          set -eu
          found=0
          while IFS= read -r f; do
            found=$((found + 1))
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; exit 1; }
            echo "ok  $f"
          done < <(git ls-files '*.sh')
          echo "$found script(s) parsed"

      # The meta-gate, and deliberately the first suite to run: it asserts that
      # every OTHER suite below is actually named in a job. `make test` globs,
      # this file lists by name, so the two drift silently and the local command
      # is the one that hides it -- which is how the four steps below sat on
      # disk running nowhere (dev-common#247).
      - name: Every test in tests/ runs in some job
        run: bash tests/ci-covers-tests.test.sh

      - name: setup-claude-identity.sh
        run: bash tests/setup-claude-identity.test.sh

      # The four below were on disk and ran in NO job -- only when a human typed
      # `make test`, which globs tests/*.test.sh and so hid the gap entirely. A test
      # that is never invoked cannot fail, which is the same shape as a detector
      # nobody reads: bdh-org/home-infra#764 found exactly this and that repo now
      # has a guard for it. Ported here as the step above
      # (dev-common#247), so this cannot recur silently. Each verified passing
      # before being wired in.
      - name: Agent commits name the App that made them, not CI
        run: bash tests/agent-commit-identity.test.sh

      - name: The Claude Code install lock blocks, steals only what is stale, and is ordered
        run: bash tests/claude-install-lock.test.sh

      - name: claude-prod / claude-dev host shims
        run: bash tests/claude-host-shim.test.sh

      - name: PATH de-duplication
        run: bash tests/path-dedup.test.sh

      # Same reason as setup-claude-identity.sh above: it runs at postCreate in
      # every repo that sources it, and every one of its failure modes is quiet
      # -- a container that comes up without the CLI, or with a credential that
      # silently resolved to an empty string (dev-common#236).
      - name: setup-grok.sh
        run: bash tests/setup-grok.test.sh

      # Extracts the hydration step out of the agent workflows and runs it for
      # real against throwaway local repos -- so the script that decides whether
      # the headless agent sees a complete checkout is no longer reachable only
      # by merging it and watching a consumer repo (dev-common#169).
      - name: hydrate-submodules.sh (embedded in the agent workflows)
        run: bash tests/hydrate-submodules.test.sh

      # The same, for the hydration step embedded in self-hosted-ci.yml -- which
      # resolves the org per submodule like the agent one, but over a SELECTED
      # path list rather than --recursive (dev-common#170).
      - name: ci-submodules.sh (embedded in self-hosted-ci.yml)
        run: bash tests/ci-submodules.test.sh

      # The template-identity gate embedded in ci.yml and self-hosted-ci.yml.
      # It is the check that would have caught bdh-org/travel being created from
      # devtemplate without `make init` -- an omission that went unnoticed
      # through two PRs and a tag because every OTHER check passed
      # (dev-common#242).
      - name: Template initialised (embedded in ci.yml AND self-hosted-ci.yml)
        run: bash tests/template-initialised.test.sh

      # The version gate embedded in ci.yml, which every Python repo in the
      # stack merges through. It ships as workflow YAML, so nothing else can
      # catch a change to it before it is enforcing the wrong rule everywhere
      # at once (dev-common#180).
      - name: Version bumped (embedded in ci.yml, self-hosted-ci.yml AND version-guard.yml)
        run: bash tests/version-bumped.test.sh

      # Its sibling, and the half the gate above cannot see: a version claimed
      # by an OPEN PR rather than by the base branch. Same three files, same
      # byte-identity requirement, so it gets the same treatment (dev-common#255).
      - name: Version claimed by another open PR (embedded in all three)
        run: bash tests/version-claimed.test.sh

      # Same shape, same reason: the step is duplicated across the two tagging
      # workflows, so the suite runs against BOTH rather than picking one.
      - name: Tag collision (embedded in tag-version.yml AND tag-version-self-hosted.yml)
        run: bash tests/tag-version-collision.test.sh
